<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyron Saga : La Quête Légendaire du Chevalier</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            image-rendering: pixelated; 
        }
        
        body { 
            font-family: 'Press Start 2P', cursive; 
            background: #050505; 
            color: white; 
            overflow: hidden; 
            transition: background 0.3s;
        }
        
        #game { 
            width: 100vw; 
            height: 100vh; 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            background-size: cover;
            background-position: center;
        }
        
        .scene { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            display: none; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            text-align: center; 
            padding: 20px;
            overflow-y: auto;
            animation: fadeIn 0.5s ease-in-out;
        }
        
        .scene.active { 
            display: flex; 
        }

        .img-box {
            width: 280px; 
            height: 320px;
            border: 6px solid #ffcc00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5), inset 0 0 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            background: #1a1a1a;
            position: relative;
            transform: scaleX(-1);
        }
        
        .img-box img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain;
            image-rendering: pixelated;
        }

        .img-princess {
            border-radius: 50%;
            width: 300px;
            height: 300px;
            border: 8px solid #ff69b4;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
        }

        .img-battle {
            width: 200px;
            height: 200px;
            margin: 15px auto;
            border: 4px solid #ffcc00;
            background: #1a1a1a;
            padding: 10px;
        }

        .img-battle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
        }

        .dialogue { 
            background: rgba(0, 0, 0, 0.95); 
            border: 5px solid #ffcc00; 
            padding: 20px; 
            max-width: 90%; 
            line-height: 1.8; 
            font-size: 11px; 
            margin-top: 15px; 
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            color: #ffcc00;
        }

        .dialogue b {
            color: #ffff00;
            text-shadow: 2px 2px #ff0000;
        }

        button { 
            margin: 8px; 
            padding: 12px 20px; 
            font-family: 'Press Start 2P', cursive; 
            background: #ffcc00; 
            color: #000;
            border: 4px solid #000; 
            cursor: pointer; 
            font-size: 9px;
            transition: all 0.1s;
            box-shadow: 4px 4px 0 #000, inset -2px -2px 0 rgba(0,0,0,0.3), inset 2px 2px 0 rgba(255,255,255,0.5);
            text-shadow: 1px 1px 0 rgba(0,0,0,0.2);
        }
        
        button:hover { 
            background: #ffff00;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000, inset -2px -2px 0 rgba(0,0,0,0.3), inset 2px 2px 0 rgba(255,255,255,0.5);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        .battle-ui { 
            width: 95%; 
            max-width: 600px; 
            background: #ffcc00; 
            color: #000; 
            border: 6px solid #000; 
            border-radius: 0;
            padding: 20px; 
            text-align: left;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
        }

        .battle-ui p {
            color: #000;
            margin: 5px 0;
            font-weight: bold;
        }

        .hp-label {
            font-size: 9px;
            color: #000;
            margin: 8px 0 3px 0;
        }

        .hp-bar { 
            height: 16px; 
            background: #ccc; 
            border: 3px solid #000; 
            width: 100%; 
            margin: 5px 0 15px 0;
            position: relative;
        }

        .hp-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #4caf50, #ffff00);
            transition: width 0.3s ease-out;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.2);
        }

        .hp-text {
            position: absolute;
            right: 5px;
            top: 0;
            font-size: 8px;
            color: #000;
            font-weight: bold;
            line-height: 16px;
        }

        .battle-text { 
            height: 80px; 
            font-size: 9px; 
            color: #000; 
            background: #fff; 
            padding: 12px; 
            border: 3px solid #000; 
            margin: 15px 0; 
            overflow-y: auto;
            line-height: 1.4;
        }

        .battle-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .battle-buttons button {
            margin: 0;
            font-size: 8px;
            padding: 10px;
        }

        #kiss-zone { 
            width: 340px; 
            height: 220px; 
            border: 6px solid #ff00ff; 
            position: relative; 
            margin: 20px; 
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .papa-container {
            position: absolute;
            top: 10px;
            right: 15px;
            width: 100px;
            height: 120px;
            border: 3px solid #000;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .papa-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
        }

        .papa-status {
            position: absolute;
            bottom: 80px;
            right: 15px;
            font-size: 8px;
            color: #fff;
            background: #000;
            padding: 5px 10px;
            border: 2px solid #fff;
            text-align: center;
            min-width: 100px;
        }

        .love-bar-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 120px;
            height: 30px;
        }

        .love-label {
            font-size: 8px;
            color: #fff;
            margin-bottom: 3px;
        }

        .hp-bar.love-bar {
            margin: 0;
            background: #ff1493;
            border-color: #ff1493;
        }

        .hp-fill.love-fill {
            background: linear-gradient(90deg, #ff1493, #ff69b4);
        }

        /* Backgrounds */
        .bg-noir { background: #050505; }
        .bg-church { background: linear-gradient(180deg, #4a3f8f 0%, #1a1a1a 100%); }
        .bg-flowers { background: linear-gradient(180deg, #ff69b4 0%, #ffb6c1 50%, #ffc0cb 100%); }
        .bg-beach { background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 40%, #ffd700 100%); }
        .bg-dark-magic { background: linear-gradient(180deg, #2a0845 0%, #1a0033 100%); }
        .bg-wedding { background: linear-gradient(180deg, #fff8dc 0%, #fffacd 50%, #ffff99 100%); }

        @keyframes fadeIn { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        @keyframes shimmer {
            0%, 100% { text-shadow: 0 0 10px #ffff00; }
            50% { text-shadow: 0 0 20px #ffff00, 0 0 30px #ffcc00; }
        }

        .shimmer {
            animation: shimmer 0.8s infinite;
        }

        .guild-box {
            width: 350px;
            height: 300px;
            border: 5px solid #ffcc00;
            background: #1a1a1a;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .guild-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform: scaleX(-1);
        }

        .guild-names {
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffcc00;
            padding: 15px;
            margin-top: 10px;
            font-size: 9px;
            max-width: 90%;
            line-height: 1.6;
            color: #ffff00;
        }
    </style>
</head>
<body>

<div id="game"></div>

function render() {
    const game = document.getElementById("game");
    if (!game) return;
    
    const scene = scenes[currentScene];
    
    // Appliquer le background
    game.className = scene.bg || "bg-noir";
    
    let html = `<div class="scene active">${scene.content}`;
    
    // Ajouter le bouton CONTINUER si nécessaire
    if (!["battle-tanguy", "battle-dragon", "kiss-game"].includes(scene.id)) {
        html += '<br><button onclick="nextScene()" style="margin-top: 20px;">▶ CONTINUER</button>';
    }
    
    html += '</div>';
    game.innerHTML = html;
    
    // Réinitialiser les HP si c'est un combat
    if (scene.id === "battle-tanguy") {
        playerHP = 100;
        enemyHP = 150;
        isBusy = false;
        updateBars("tanguy");
    }
    
    if (scene.id === "battle-dragon") {
        playerHP = 100;
        dragonHP = 200;
        isBusy = false;
        updateBars("dragon");
    }
    
    if (scene.id === "kiss-game") {
        initKissGame();
    }
}

function nextScene() {
    currentScene++;
    if (currentScene < scenes.length) {
        render();
    }
}

function failDress(choice) {
    alert("Mauvais choix... essaie la perruque rose !");
}

function winDress(choice) {
    if (choice === "perruque") {
        nextScene(); // Aller à WIN DRESS
    }
}

// SYSTÈME DE COMBAT TANGUY
function fight(move, type) {
    if (isBusy) return;
    isBusy = true;
    
    const txt = document.getElementById(type === "dragon" ? "battleDragonText" : "battleText");
    let damage = 0;
    let healing = 0;
    
    if (move === "kick") {
        damage = 50;
        txt.innerText = "Tyron balance un HIGH-KICK dévastateur !\n\n⚡ -50 PV !";
    } else if (move === "regard") {
        damage = 60;
        txt.innerText = "Tyron contracte ses pectoraux avec intensité !\n\nTanguy rougit violemment...\n⚡ -60 PV !";
    } else if (move === "charisme") {
        damage = 60;
        txt.innerText = "Tyron déploie son CHARISME LÉGENDAIRE !\n\nC'est hyper efficace !\n⚡ -60 PV !";
    } else if (move === "whey" || move === "protéine") {
        healing = 50;
        txt.innerText = "Tyron boit un verre de PROTÉINE PURE !\n\n💪 +50 PV !";
    } else if (move === "ignore" || move === "fuite") {
        txt.innerText = "Tyron essaie d'ignorer Tanguy...\n\nMais il bloque toujours le passage !\n\nC'est inefficace...";
    } else if (move === "epee") {
        damage = 80;
        txt.innerText = "Tyron dégaine son ÉPÉE LÉGENDAIRE !\n\nElle brille d'une lumière divine !\n⚡ -80 PV !";
    } else if (move === "coeur") {
        damage = 100;
        txt.innerText = "Tyron puise dans la FORCE DE SON CŒUR !\n\nLa Princesse l'appelle...\n💥 -100 PV !";
    }
    
    if (type === "tanguy") {
        enemyHP -= damage;
        if (healing > 0) playerHP = Math.min(100, playerHP + healing);
    } else if (type === "dragon") {
        dragonHP -= damage;
        if (healing > 0) playerHP = Math.min(100, playerHP + healing);
    }
    
    updateBars(type);
    
    setTimeout(() => {
        const isDefeated = (type === "tanguy" && enemyHP <= 0) || (type === "dragon" && dragonHP <= 0);
        
        if (isDefeated) {
            txt.innerText = "VICTOIRE ÉCRASANTE !\n\n★ ★ ★ ★ ★";
            setTimeout(nextScene, 1500);
        } else {
            // Contre-attaque
            if (type === "tanguy") {
                const tLine = tanguyLines[Math.floor(Math.random() * tanguyLines.length)];
                txt.innerText = tLine + "\n\nTanguy contre-attaque !\n\n❤️‍🔥 -15 PV !";
                playerHP -= 15;
            } else if (type === "dragon") {
                txt.innerText = "Le DRAGON crache du FEU FURIEUX !\n\n🔥 -20 PV !";
                playerHP -= 20;
            }
            
            updateBars(type);
            isBusy = false;
        }
    }, 1200);
}

function updateBars(type) {
    if (type === "tanguy") {
        const eBar = document.getElementById("eHP");
        const pBar = document.getElementById("pHP");
        const eText = document.getElementById("eHPText");
        const pText = document.getElementById("pHPText");
        
        if (eBar) eBar.style.width = (enemyHP / 150 * 100) + "%";
        if (pBar) pBar.style.width = (playerHP / 100 * 100) + "%";
        if (eText) eText.innerText = Math.max(0, enemyHP) + "/150";
        if (pText) pText.innerText = Math.max(0, playerHP) + "/100";
    } else if (type === "dragon") {
        const eBar = document.getElementById("eDragonHP");
        const pBar = document.getElementById("pDragonHP");
        const eText = document.getElementById("eDragonHPText");
        const pText = document.getElementById("pDragonHPText");
        
        if (eBar) eBar.style.width = (dragonHP / 200 * 100) + "%";
        if (pBar) pBar.style.width = (playerHP / 100 * 100) + "%";
        if (eText) eText.innerText = Math.max(0, dragonHP) + "/200";
        if (pText) pText.innerText = Math.max(0, playerHP) + "/100";
    }
}

// SYSTÈME BAISER
let kissGameInterval = null;

function initKissGame() {
    kissProgress = 0;
    papaLooking = false;
    document.getElementById("love-fill").style.width = "0%";
    
    kissGameInterval = setInterval(() => {
        if (currentScene !== 19) {
            clearInterval(kissGameInterval);
            return;
        }
        
        // Papa regarde aléatoirement
        papaLooking = Math.random() > 0.5;
        const status = document.getElementById("papaStatus");
        const container = document.querySelector(".papa-container");
        
        if (status) {
            status.innerText = papaLooking ? "😤 IL VOIT !" : "😴 Il dort...";
            status.style.background = papaLooking ? "#ff0000" : "#000";
            status.style.color = papaLooking ? "#fff" : "#ffff00";
        }
        
        if (container) {
            container.style.opacity = papaLooking ? "1" : "0.5";
        }
    }, 1500);
}

function startKiss() {
    if (kissInterval) return;
    
    kissInterval = setInterval(() => {
        if (currentScene !== 19) {
            clearInterval(kissInterval);
            kissInterval = null;
            return;
        }
        
        if (papaLooking) {
            // Papa voit ! On perd du progrès
            kissProgress = Math.max(0, kissProgress - 3);
            document.body.style.background = "#ff0000";
            setTimeout(() => {
                if (document.body.style.background === "#ff0000") {
                    document.body.style.background = "";
                }
            }, 200);
        } else {
            // Papa dort ! On gagne du progrès
            kissProgress += 3;
            document.body.style.background = "";
        }
        
        const fill = document.getElementById("love-fill");
        if (fill) fill.style.width = kissProgress + "%";
        
        if (kissProgress >= 100) {
            clearInterval(kissInterval);
            clearInterval(kissGameInterval);
            kissInterval = null;
            document.body.style.background = "";
            nextScene();
        }
    }, 100);
}

function stopKiss() {
    if (kissInterval) {
        clearInterval(kissInterval);
        kissInterval = null;
        document.body.style.background = "";
    }
}

// Démarrage
window.onload = () => {
    render();
};
