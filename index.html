<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyron le Chevalier : La Quête de l'ICAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* BASICS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Press Start 2P', cursive;
      background: black;
      color: white;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      animation: fadeIn 1s ease-in-out;
      z-index: 2;
    }

    .active { display: flex; }

    .dialogue {
      background: rgba(0,0,0,0.8);
      border: 4px solid white;
      padding: 20px;
      max-width: 90%;
      line-height: 1.8;
      font-size: 11px;
      margin-top: 20px;
    }

    button {
      margin-top: 10px;
      padding: 15px;
      font-family: inherit;
      background: yellow;
      border: 4px solid black;
      cursor: pointer;
      font-size: 10px;
    }

    button:hover { background: orange; transform: scale(1.05); }

    /* ANIMATIONS & BACKGROUNDS */
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    
    .stars {
      background: radial-gradient(white 1px, transparent 1px);
      background-size: 20px 20px;
      animation: starsMove 40s linear infinite;
    }
    @keyframes starsMove { from {background-position: 0 0;} to {background-position: 1000px 1000px;} }

    /* DÉCORS ANIMÉS */
    .flowers-bg {
      background: #ffb6c1;
      overflow: hidden;
    }
    .flower {
      position: absolute;
      font-size: 40px;
      animation: float 3s infinite ease-in-out;
    }

    .beach-bg {
      background: linear-gradient(to bottom, #4da6ff 60%, #ffd700 60%);
    }
    .crab {
      position: absolute;
      bottom: 10%;
      font-size: 30px;
      animation: crabWalk 5s infinite linear;
    }
    .palm {
      position: absolute;
      bottom: 40%;
      font-size: 80px;
      filter: drop-shadow(5px 5px 0px rgba(0,0,0,0.2));
    }

    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(20deg); } }
    @keyframes crabWalk { 0% { left: -10%; } 100% { left: 110%; } }

    /* CHARACTERS */
    .character-container { display: flex; justify-content: center; align-items: center; gap: 80px; margin-top: 20px; }
    .tyron, .princess { position: relative; width: 140px; height: 220px; animation: bounce 1s infinite alternate; }
    
    /* Tyron Details */
    .tyron .head { width: 60px; height: 60px; background: #f2c28b; position: absolute; top: 20px; left: 40px; border: 4px solid black; }
    .tyron .head::after { content: "👀"; position: absolute; top: 15px; left: 10px; font-size: 15px; }
    .tyron .hat { width: 80px; height: 35px; background: #228b22; position: absolute; top: 0; left: 30px; border: 4px solid black; }
    .tyron .body { width: 90px; height: 90px; background: #228b22; position: absolute; top: 80px; left: 25px; border: 4px solid black; }
    .tyron .arm { width: 20px; height: 70px; background: #f2c28b; position: absolute; top: 90px; border: 4px solid black; }
    .tyron .arm.left { left: 0px; }
    .tyron .arm.right { right: 0px; }

    /* Princess Details */
    .princess .hair { width: 100px; height: 100px; background: #ff4500; position: absolute; top: 5px; left: 20px; border: 4px solid black; border-radius: 10px; }
    .princess .head { width: 60px; height: 60px; background: #f2c28b; position: absolute; top: 25px; left: 40px; border: 4px solid black; }
    .princess .head::after { content: "✨"; position: absolute; top: 10px; left: 10px; color: green; }
    .princess .body { width: 100px; height: 110px; background: #ff69b4; position: absolute; top: 85px; left: 20px; border: 4px solid black; clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); }

    /* COMBAT UI */
    .battle-ui { border: 6px solid white; padding: 15px; width: 90%; background: #2c3e50; }
    .health-container { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 10px; }
    .health { width: 120px; height: 15px; background: #c0392b; border: 2px solid white; }
    .health-bar { height: 100%; background: #2ecc71; transition: width 0.3s; }
    
    .dragon { font-size: 100px; animation: shake 0.3s infinite alternate; }
    @keyframes shake { from { transform: translate(-5px, 0); } to { transform: translate(5px, 5px); } }
  </style>
</head>
<body>

<div id="game"></div>

<script>
let currentScene = 0;
let enemyHP = 100;
let playerHP = 100;
let dragonHP = 15;

const scenes = [
{
  bg: 'stars',
  content: `
    <div style="color:yellow; text-shadow:2px 2px red; line-height:1.6;">
      Il y a très longtemps...<br><br>
      Le 6 mai 2003, Tyron naquit sous une étoile d'acier.<br>
      <b>Le Chevalier Tyron :</b> Un guerrier au cœur d'ingénieur, 
      capable de soulever des montagnes de fonte et de résoudre des équations complexes en plein combat.<br><br>
      Son armure ? Une tunique verte héritée des anciens. Son arme ? Sa détermination brute.<br>
      Son destin ? L'ICAM.
    </div>`
},
{
  content: `
    <div class="character-container">
      <div class="tyron">
        <div class="hat"></div><div class="head"></div><div class="body"></div>
        <div class="arm left"></div><div class="arm right"></div>
      </div>
    </div>
    <div class="dialogue">
      Tyron recruta sa guilde originelle : Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste.<br><br>
      Ensemble, ils bravent les sentiers de randonnée et les nuits sans sommeil.<br>
      Mais attention, quand Tyron boit la "potion magique" de soirée, il devient incontrôlable !
    </div>`
},
{
  content: `
    <div class="dialogue">
      Entrée à l’ICAM... L'enfer commence.<br><br>
      Soudain, <b>TANGUY LE SORCIER MUSCLÉ</b> bloque le passage !<br>
      "Tes muscles sont d'argile, Tyron ! Goûte au brouillard mental !"
    </div>`
},
{
  id: "battle-tanguy",
  content: `
    <div class="battle-ui">
      <div class="health-container">
        <div>TYRON: <div class="health"><div class="health-bar" id="pHP" style="width:100%"></div></div></div>
        <div>TANGUY: <div class="health"><div class="health-bar" id="eHP" style="width:100%"></div></div></div>
      </div>
      <div style="font-size:60px;">🧙‍♂️💪</div>
      <p id="battle-log" style="font-size:10px; margin:10px 0;">Tanguy gonfle ses pecs !</p>
      <div id="battle-btns">
        <button onclick="playerAction('atk')">LANCER UN RAPPORT</button>
        <button onclick="playerAction('whey')">BOIRE DE LA WHEY (+30HP)</button>
      </div>
    </div>`
},
{
  content: `
    <div class="dialogue">
      Tanguy est vaincu (pour cette fois).<br><br>
      Tyron s'allie avec sa nouvelle garde ICAM : <br>
      Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan et Quentin.<br>
      Leur force ? Transformer le chaos en projet validé.
    </div>`
},
{
  bg: 'flowers-bg',
  content: `
    <div class="flower" style="top:10%; left:10%;">🌸</div>
    <div class="flower" style="top:20%; right:20%;">🌹</div>
    <div class="flower" style="bottom:30%; left:50%;">🌷</div>
    <div class="character-container">
      <div class="tyron"><div class="hat"></div><div class="head"></div><div class="body"></div></div>
      <div class="princess"><div class="hair"></div><div class="head"></div><div class="body"></div></div>
    </div>
    <div class="dialogue">
      Devant l'église, le temps s'arrête.<br><br>
      Tyron croise <b>La Princesse Rousse</b> aux yeux émeraude.<br>
      Une aura de mystère et de douceur l'entoure. Le code de son cœur vient de bugger... c'est le coup de foudre.
    </div>`
},
{
  bg: 'beach-bg',
  content: `
    <div class="palm" style="left:5%;">🌴</div>
    <div class="palm" style="right:5%;">🌴</div>
    <div class="crab">🦀</div>
    <div class="dialogue">
      Séparation ! Madrid pour elle, les Philippines pour lui.<br><br>
      Entre les poissons exotiques et les couchers de soleil, Tyron doit apprendre le <b>STYLE</b> pour ne pas être oublié.
    </div>
    <button onclick="dressGame()">COMMENCER DRESS TO IMPRESS</button>`
},
{
  content: `
    <div class="dialogue">
      CATASTROPHE !<br>
      La Sorcière Violette a frappé : la Princesse est tombée dans un sommeil profond après avoir croqué dans un <b>croissant aux amandes empoisonné</b> !
    </div>`
},
{
  content: `
    <div class="dragon" id="dragon-sprite">🐉</div>
    <div class="dialogue">
      LE DRAGON DE LA TRISTESSE !<br>
      Il garde le remède. Clique vite pour l'abattre !
    </div>
    <button id="atk-dragon-btn">⚔ ATTAQUER LE DRAGON (<span id="dHP">15</span>)</button>`
},
{
  bg: 'stars',
  content: `
    <div style="color:yellow; text-shadow:2px 2px pink;">
      👑 NOCES LÉGENDAIRES 👑<br><br>
      Tyron a sauvé sa princesse rousse.<br>
      Le monde de l'ICAM est en paix.<br><br>
      <b>RÉCOMPENSE DÉBLOQUÉE :</b><br>
      LA MONTRE DE SPORT DE PUISSANCE +99<br><br>
      JOYEUX ANNIVERSAIRE TYRON !
    </div>`
}
];

function renderScene() {
  const game = document.getElementById("game");
  let scene = scenes[currentScene];
  game.className = scene.bg || "";
  
  game.innerHTML = `
    <div class="scene active">
      ${scene.content}
      ${currentScene < scenes.length-1 && !['battle-tanguy', 'dress-scene'].includes(scene.id) && currentScene !== 6 && currentScene !== 8 ? '<button onclick="nextScene()">CONTINUER</button>' : ''}
    </div>
  `;

  // Ré-attacher l'évenement du dragon si on est sur la scène 8
  if(currentScene === 8) {
    document.getElementById('atk-dragon-btn').addEventListener('click', attackDragon);
  }
}

function nextScene() {
  currentScene++;
  renderScene();
}

// COMBAT TANGUY
function playerAction(type) {
  const log = document.getElementById("battle-log");
  if(type === 'atk') {
    enemyHP -= 20;
    log.innerText = "Tyron balance un rapport de 50 pages ! Tanguy chancelle !";
  } else {
    playerHP = Math.min(100, playerHP + 30);
    log.innerText = "Tyron avale un shaker de Whey ! Gains maximaux !";
  }
  
  // Tanguy Riposte
  if(enemyHP > 0) {
    setTimeout(() => {
      playerHP -= 15;
      log.innerText = "Tanguy lance : 'DÉVELOPPÉ COUCHÉ !' Tyron perd 15 PV.";
      updateBars();
      if(playerHP <= 0) {
        alert("Tyron est KO ! Recommence le round !");
        playerHP = 100; enemyHP = 100;
        renderScene();
      }
    }, 600);
  } else {
    nextScene();
  }
  updateBars();
}

function updateBars() {
  if(document.getElementById("eHP")) document.getElementById("eHP").style.width = enemyHP + "%";
  if(document.getElementById("pHP")) document.getElementById("pHP").style.width = playerHP + "%";
}

// MINI JEU STYLE
function dressGame() {
  const game = document.getElementById("game");
  game.innerHTML = `
  <div class="scene active beach-bg">
    <div class="dialogue">Choisis la tenue pour impressionner la princesse :</div>
    <button onclick="alert('Trop sobre !');">Le Maillot de bain classique</button>
    <button onclick="correctDress()">LA PERRUQUE ROSE FLUO</button>
  </div>`;
}

function correctDress() {
  alert("INCROYABLE ! LE CHARISME EST OVER 9000 !");
  nextScene();
}

// COMBAT DRAGON (Fixé)
function attackDragon() {
  dragonHP--;
  document.getElementById("dHP").innerText = dragonHP;
  document.getElementById("dragon-sprite").style.transform = "scale(1.2)";
  setTimeout(() => { 
    if(document.getElementById("dragon-sprite")) 
      document.getElementById("dragon-sprite").style.transform = "scale(1)"; 
  }, 100);

  if(dragonHP <= 0) {
    nextScene();
  }
}

renderScene();
</script>

</body>
</html>
