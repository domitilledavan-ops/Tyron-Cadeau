<!-- ===== CSS : REMPLACE .tyron-pixel EXISTANT ===== -->
<style>
.tyron-pixel {
  width:128px;
  height:200px;
  margin: 0 38px;
  position:relative;
  display:inline-block;
  animation:pulse 1.4s infinite;
  transform: scale(2);
  transform-origin:center;
}

/* ===== AJOUT PRINCESSE PIXEL ===== */
.princess-pixel {
  width:128px;
  height:200px;
  margin: 0 38px;
  position:relative;
  display:inline-block;
  animation: princessFloat 1.8s infinite;
  transform: scale(2);
  transform-origin:center;
}

.princess-pixel::before {
  content:'';
  display:block;
  width:2px;
  height:2px;
  box-shadow:
    /* Cheveux roux */
    14px 2px #d96b2b,
    16px 2px #e67e22,
    18px 2px #d96b2b,
    20px 2px #c45f1f,

    12px 4px #f2994a,
    14px 4px #d96b2b,
    16px 4px #e67e22,
    18px 4px #e67e22,
    20px 4px #d96b2b,
    22px 4px #f2994a,

    /* Visage */
    14px 8px #ffe0b0,
    16px 8px #ffe0b0,
    18px 8px #ffe0b0,
    20px 8px #ffe0b0,

    /* Yeux verts */
    14px 10px #2ecc71,
    20px 10px #2ecc71,

    /* Couronne */
    16px 0px #f8c400,
    18px 0px #f8c400,

    /* Robe */
    14px 14px #fd38a0,
    16px 14px #ff66cc,
    18px 14px #ff66cc,
    20px 14px #fd38a0,

    12px 16px #ff9de2,
    14px 16px #fd38a0,
    16px 16px #ff66cc,
    18px 16px #ff66cc,
    20px 16px #fd38a0,
    22px 16px #ff9de2,

    12px 20px #ffffff,
    14px 20px #fd38a0,
    16px 20px #ffffff,
    18px 20px #ffffff,
    20px 20px #fd38a0,
    22px 20px #ffffff,

    14px 24px #fd38a0,
    16px 24px #fd38a0,
    18px 24px #fd38a0,
    20px 24px #fd38a0;
  position:absolute;
  top:0;
  left:0;
}

@keyframes princessFloat {
  0% {transform:scale(2) translateY(0);}
  50% {transform:scale(2) translateY(-6px);}
  100% {transform:scale(2) translateY(0);}
}
</style>

<script>
/* ===== VARIABLES ===== */
const princessSprite = '<span class="princess-pixel"></span>';

/* ===== ÉCRAN D’ACCUEIL ===== */
html += '<div class="dialogue-box" style="font-size:1.2em;">'
  + 'Bienvenue dans <b>TYRON QUEST</b>.<br>'
  + 'Survis aux réveils en amphi, aux rendus envoyés à 23h59, aux soirées qui dérapent, '
  + 'aux plans douteux validés par “t’inquiète frère ça passe”.<br><br>'
  + 'Le vrai boss final ? Les projets de groupe avec des ingénieurs.'
  + '</div>';

/* ===== SCÈNE 0 PROLOGUE ===== */
html += '<div class="dialogue-box"><div class="dialogue-speaker">📝 Narrateur</div>'
  + '<b>Il y a très longtemps...</b><br>'
  + 'Naissait Tyron, futur survivant des partiels, des stages obscurs et des groupes WhatsApp de promo.<br><br>'
  + 'Le 6 mai 2003, un mardi tragique, arrivait un enfant destiné à entendre :<br>'
  + '<b>"On a un projet de groupe, c’est simple."</b><br><br>'
  + 'Erreur. Ce n’était jamais simple.'
  + '</div>';

/* ===== SCÈNE ICAM ===== */
html += '<div class="dialogue-box"><div class="dialogue-speaker">📝 Narrateur</div>'
  + 'Tyron rejoint l’ICAM :<br><br>'
  + '1. Là où le café remplace le sang<br>'
  + '2. Où “petit projet” signifie 14 heures de souffrance<br>'
  + '3. Où tes potes peuvent fabriquer une éolienne… mais perdent leurs clés 5 fois par semaine.<br><br>'
  + 'Après 4 nuits blanches, Tyron comprit qu’un ingénieur considère les pâtes instantanées comme une stratégie de survie.'
  + '</div>';

/* ===== SCÈNE GUILDE ===== */
html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>'
  + 'Cette nouvelle guilde maîtrise :<br>'
  + '- Les soirées improvisées un mardi<br>'
  + '- Les idées type “et si on testait juste pour voir ?”<br>'
  + '- Les expériences dangereuses menées “pour la science”<br><br>'
  + 'Martin proposa une soirée calme.<br>'
  + 'Trois heures plus tard, quelqu’un utilisait un extincteur comme accessoire de chorégraphie.'
  + '</div>';

/* ===== SCÈNE PRINCESSE ===== */
html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>'
  + 'Un dimanche, alors que Tyron tentait de récupérer de sa semaine de génie mécanique...<br>'
  + '<b>BOUM.</b><br>'
  + 'Apparaît une princesse rousse aux yeux verts.<br>'
  + 'Plus rare qu’un étudiant organisé en semaine de partiels.'
  + '<div style="text-align:center;">'+princessSprite+'</div>'
  + '</div>';

/* ===== SCÈNE MANGA ===== */
html += '<div class="dialogue-box"><div class="dialogue-speaker">Tyron</div>'
  + 'Tyron la percute.<br>'
  + 'Pas avec grâce. Pas avec style.<br>'
  + 'Plutôt comme un étudiant en retard avec 3 cafés et aucun équilibre.<br><br>'
  + 'Le crush fut immédiat.'
  + '</div>';

/* ===== PHILIPPINES ===== */
html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>'
  + 'Pendant que la princesse partait en quête, Tyron s’envola avec sa team.<br>'
  + 'Objectif officiel : voyage.<br>'
  + 'Objectif réel : décisions douteuses, soirées absurdes et photos compromettantes.<br><br>'
  + 'PA répétait : “T’inquiète.”<br>'
  + 'Personne ne savait si ça concernait une boîte, un scooter ou une idée illégale.'
  + '</div>';

/* ===== BOSS FINAL ===== */
html += '<div class="boss-area">'
  + '<span class="tyron-pixel"></span>'
  + '<span class="emoji-boss">🐉</span>'
  + '<span class="boss-flame"></span>'
  + '<span class="princess-pixel"></span>'
  + '</div>';

/* ===== MARIAGE ===== */
html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>'
  + 'Après avoir vaincu dragons, croissants maudits, projets de groupe et lendemains de soirée...<br><br>'
  + '<b>Tyron a réussi.</b><br>'
  + 'Il obtient la victoire ultime :<br>'
  + 'Une princesse, une montre de sport, et probablement encore des potes en train de faire une connerie derrière la salle des fêtes.'
  + '</div>';
</script>
