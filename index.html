<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyron le Chevlaier : La Quête de l'ICAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Press Start 2P', cursive;
      background: black;
      color: white;
      overflow: hidden;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      animation: fadeIn 1s ease-in-out;
    }

    .active { display: flex; }

    .dialogue {
      background: rgba(0,0,0,0.8);
      border: 4px solid white;
      padding: 20px;
      max-width: 90%;
      line-height: 1.8;
      font-size: 12px;
      margin-top: 20px;
    }

    button {
      margin-top: 20px;
      padding: 15px;
      font-family: inherit;
      background: yellow;
      border: 4px solid black;
      cursor: pointer;
      font-size: 10px;
    }

    button:hover {
      background: orange;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    @keyframes stars {
      from {background-position: 0 0;}
      to {background-position: 1000px 1000px;}
    }

    .stars {
      background: radial-gradient(white 1px, transparent 1px);
      background-size: 20px 20px;
      animation: stars 40s linear infinite;
    }

    .yellow-text {
      color: yellow;
      text-shadow: 3px 3px red;
      font-size: 14px;
      line-height: 2;
    }

    /* TYRON PIXEL ART */
    .character-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 120px;
      margin-top: 40px;
    }

    .tyron, .princess {
      position: relative;
      width: 180px;
      height: 260px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    /* Tyron */
    .tyron .head {
      width: 70px;
      height: 70px;
      background: #f2c28b;
      position: absolute;
      top: 20px;
      left: 55px;
      border: 4px solid black;
    }

    .tyron .hat {
      width: 90px;
      height: 40px;
      background: green;
      position: absolute;
      top: 0;
      left: 45px;
      border: 4px solid black;
    }

    .tyron .body {
      width: 100px;
      height: 100px;
      background: green;
      position: absolute;
      top: 90px;
      left: 40px;
      border: 4px solid black;
    }

    .tyron .arm {
      width: 25px;
      height: 80px;
      background: #f2c28b;
      position: absolute;
      top: 100px;
      border: 4px solid black;
    }

    .tyron .arm.left { left: 10px; }
    .tyron .arm.right { right: 10px; }

    .tyron .leg {
      width: 30px;
      height: 70px;
      background: brown;
      position: absolute;
      top: 190px;
      border: 4px solid black;
    }

    .tyron .leg.left { left: 50px; }
    .tyron .leg.right { right: 50px; }

    /* Princess */
    .princess .hair {
      width: 90px;
      height: 90px;
      background: orangered;
      position: absolute;
      top: 10px;
      left: 45px;
      border: 4px solid black;
    }

    .princess .head {
      width: 70px;
      height: 70px;
      background: #f2c28b;
      position: absolute;
      top: 30px;
      left: 55px;
      border: 4px solid black;
    }

    .princess .body {
      width: 110px;
      height: 120px;
      background: pink;
      position: absolute;
      top: 100px;
      left: 35px;
      border: 4px solid black;
    }

    .princess .leg {
      width: 30px;
      height: 60px;
      background: pink;
      position: absolute;
      top: 220px;
      border: 4px solid black;
    }

    .princess .leg.left { left: 55px; }
    .princess .leg.right { right: 55px; }

    .pink-bg {
      background: linear-gradient(to bottom, pink, lavender);
    }

    .beach {
      background: linear-gradient(to bottom, skyblue 60%, gold 60%);
    }

    .battle-ui {
      border: 6px solid white;
      padding: 20px;
      width: 80%;
      background: darkslateblue;
    }

    .health {
      width: 200px;
      height: 20px;
      background: red;
      margin: 10px auto;
      position: relative;
    }

    .health-bar {
      height: 100%;
      background: lime;
      width: 100%;
    }

    .dragon {
      font-size: 120px;
      animation: shake 0.5s infinite alternate;
    }

    @keyframes shake {
      from { transform: translateX(-10px);}
      to { transform: translateX(10px);}
    }

    .sparkle {
      animation: sparkle 1s infinite alternate;
    }

    @keyframes sparkle {
      from { text-shadow: 0 0 10px yellow; }
      to { text-shadow: 0 0 30px white; }
    }
  </style>
</head>
<body>
<div id="game"></div>

<script>
const scenes = [
{
bg:'stars',
content:`
<div class="yellow-text">
Il y a très longtemps...<br><br>
Le 6 mai 2003, sous un ciel plus dramatique qu’un serveur en surcharge avant rendu de projet...<br>
naquit Tyron le Chevlaier.<br><br>
Petit héros en tunique verte, moitié sportif, moitié ingénieur,<br>
capable de courir plus vite qu’un bug critique et boxer plus fort qu’un prof corrigeant un rapport en retard.<br><br>
Son destin ? Devenir une légende... ou au moins survivre à l’ICAM.
</div>`
},
{
content:`
<div class="character-container">
<div class="tyron">
<div class="hat"></div><div class="head"></div><div class="body"></div>
<div class="arm left"></div><div class="arm right"></div>
<div class="leg left"></div><div class="leg right"></div>
</div>
</div>
<div class="dialogue">
Tyron recruta sa première guilde : Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste.<br><br>
Une bande si solide qu’on aurait dit un groupe WhatsApp sans mute.<br>
Ensemble, ils affrontèrent randonnées, soirées, films tranquilles...<br>
et surtout les lendemains où Tyron, après quelques breuvages, devenait plus imprévisible qu’un code sans commentaires.
</div>`
},
{
content:`
<div class="dialogue">
Animé par la noble quête du savoir, Tyron entra à l’ICAM...<br><br>
Mais à peine son pied posé dans cette académie infernale...<br>
TANGUY LE SORCIER MUSCLÉ surgit !<br><br>
“BROUILLARD MENTAL !” hurla-t-il, probablement par amour secret et très mal géré.<br><br>
Tyron oublia jusqu’à comment différencier une intégrale d’un grille-pain.
</div>`
},
{
content:`
<div class="battle-ui">
<h2>⚔ TYRON vs 💪 TANGUY</h2>
<div>Tyron ❤️</div>
<div class="health"><div class="health-bar" id="enemyHealth"></div></div>
<div style="font-size:80px;">🧙‍♂️💪</div>
<button onclick="attackTanguy()">ATTAQUE D'INGÉNIERIE</button>
</div>`
},
{
content:`
<div class="dialogue">
Libéré !<br><br>
Tanguy vaincu retourna faire des poses mystérieuses dans l’ombre.<br><br>
Tyron rejoignit alors sa nouvelle guilde ICAM : Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan et Quentin.<br><br>
Assez puissants pour transformer un simple café en réunion de crise de 4 heures.
</div>`
},
{
bg:'pink-bg',
content:`
<div class="character-container">
<div class="tyron">
<div class="hat"></div><div class="head"></div><div class="body"></div>
<div class="arm left"></div><div class="arm right"></div>
<div class="leg left"></div><div class="leg right"></div>
</div>

<div class="princess">
<div class="hair"></div><div class="head"></div><div class="body"></div>
<div class="leg left"></div><div class="leg right"></div>
</div>
</div>

<div class="dialogue">
🌸 Sur le chemin de la messe... 🌹<br><br>
Tyron, reconstruit dans sa foi et son style approximatif,<br>
percuta une princesse rousse aux yeux verts.<br><br>
Le choc fut plus intense qu’un sprint après avoir dit “t’inquiète j’arrive”.<br>
Le destin venait de compiler.
</div>`
},
{
bg:'beach',
content:`
<div class="dialogue">
Mais la vie, scénariste sadique, les sépara...<br><br>
La princesse partit à Madrid.<br>
Tyron aux Philippines.<br><br>
Entre plages, soleil et crise vestimentaire,<br>
notre héros comprit que même la bravoure ne suffisait pas...<br>
Il fallait du STYLE.
</div>
<button onclick="dressGame()">COMMENCER DRESS TO IMPRESS</button>`
},
{
content:`
<div class="dialogue">
La sorcière violette surgit...<br><br>
Dans un acte de cruauté pâtissière absolue,<br>
elle empoisonna la princesse... avec un croissant aux amandes.<br><br>
Oui. Un croissant.<br>
Comme quoi le mal prend parfois la forme d’une viennoiserie.
</div>`
},
{
content:`
<div class="dragon">🐉</div>
<div class="dialogue">
LE DRAGON DE LA TRISTESSE<br><br>
Clique ! Sauve ton amour !
</div>
<button onclick="attackDragon()">⚔ ATTAQUER</button>`
},
{
content:`
<div class="sparkle yellow-text">
👑 MARIAGE GRANDIOSE 👑<br><br>
Tyron et sa princesse triomphèrent.<br><br>
Après tant d’épreuves, d’amitié, de sport, d’amour et de croissants douteux...<br>
Ils obtinrent la récompense suprême :<br><br>
LA MONTRE DE SPORT LÉGENDAIRE.<br><br>
FIN... ou peut-être juste l’échauffement.
</div>`
}
];

let currentScene = 0;
let enemyHP = 100;
let dragonHP = 15;

function renderScene() {
  const game = document.getElementById("game");
  let scene = scenes[currentScene];
  game.className = "";
  if(scene.bg) game.classList.add(scene.bg);

  game.innerHTML = `
    <div class="scene active">
      ${scene.content}
      ${currentScene < scenes.length-1 && currentScene !== 3 && currentScene !== 6 && currentScene !== 8 ? '<button onclick="nextScene()">CONTINUER</button>' : ''}
    </div>
  `;
}

function nextScene() {
  currentScene++;
  renderScene();
}

function attackTanguy() {
  enemyHP -= 25;
  document.getElementById("enemyHealth").style.width = enemyHP + "%";
  if(enemyHP <= 0) nextScene();
}

function dressGame() {
  const game = document.getElementById("game");
  game.innerHTML = `
  <div class="scene active">
    <div class="dialogue">
    Choisis la tenue ultime pour survivre socialement :
    </div>
    <button onclick="wrongDress()">Robe Pailletée</button>
    <button onclick="correctDress()">Perruque Rose</button>
  </div>`;
}

function wrongDress() {
  alert("Erreur tragique. Même aux Philippines, faut doser.");
}

function correctDress() {
  alert("CHARISME MAXIMAL.");
  nextScene();
}

function attackDragon() {
  dragonHP--;
  if(dragonHP <= 0) nextScene();
}

renderScene();
</script>
</body>
</html>
