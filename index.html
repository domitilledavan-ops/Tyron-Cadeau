<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyron : Le Chevalier au Cœur de Soie - Pixel Saga</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
    body {
      font-family: 'Press Start 2P', cursive;
      background: #000; color: white; overflow: hidden;
    }

    #game { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    .scene { position: absolute; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; z-index: 5; animation: fadeIn 0.8s; }
    .active { display: flex; }

    .dialogue { background: rgba(0,0,0,0.9); border: 4px solid #fff; padding: 15px; max-width: 85%; line-height: 1.6; font-size: 10px; margin-top: 15px; box-shadow: 0 0 20px rgba(255,255,255,0.2); position: relative; z-index: 10;}
    
    .floating-text {
      position: absolute; color: #ff00ea; font-size: 12px; font-weight: bold;
      animation: floatUp 1.5s forwards; pointer-events: none; z-index: 20;
      text-shadow: 2px 2px #000;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-100px); }
    }

    button { margin: 5px; padding: 10px; font-family: inherit; background: #ffea00; border: 3px solid #000; cursor: pointer; font-size: 8px; transition: 0.2s; position: relative; z-index: 11;}
    button:hover { background: #ffae00; transform: translateY(-2px); }
    button:disabled { background: #555; cursor: not-allowed; }

    /* PIXEL ART CANVAS STYLES */
    .pixel-sprite { background-size: contain; background-repeat: no-repeat; background-position: center; animation: bounce 1s infinite alternate;}
    
    /* Tyron - Basé sur l'armure verte du dessin */
    .sprite-tyron { width: 96px; height: 128px; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAYAAAAICAMAAAAO/ML8AAAAAXNSR0IArs4c6QAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAADVQTFRF////AABmZv+Zmf+Z//+Z/2ZmAABmZmb/AABmzMzMzP+ZAABmADMzMzOZZmZmzMzMAAAAAEDv8WIAAAAidklEQVR4nGNiYAQCZkZGJgYmBg4GJggFE8PEQAAi4IQZAC3wAMmZfG4YAAAAAElFTkSuQmCC');}
    
    /* Tanguy - Sorcier Musclé */
    .sprite-tanguy { width: 96px; height: 128px; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAYAAAAICAMAAAAO/ML8AAAAAXNSR0IArs4c6QAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAAD9QTFRF////AACZ/wBm//+ZmZnMmf//mZmZ//+ZAABmM5nMZmaZAGbMmZlmAJmZAMzMzMzMAAAAzADMAAAAAAAAGL9yXwAAAChklEQVR4nGNiYGRiYAQTDEwMDEwMTAwMYIohEAzBBDMDBMIEEAgGACoAARE0P5GZAAAAAElFTkSuQmCC');}
    
    /* Princesse Rousse - Tunique verte */
    .sprite-princesse { width: 96px; height: 128px; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAYAAAAICAMAAAAO/ML8AAAAAXNSR0IArs4c6QAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAAD9QTFRF////AABm//+Zmf//ZmZm/wBmAGZmM5nMZmZmAJmZ//9mAMzMzMzMzP//ZmaZAABmAADMAAAA////AAAA76/x7AAAAChklEQVR4nGNiYGRkYAQTTDDEBEwMDEwMIAkhMIEQTBBEwAQEwAQMACvHAQtE81kCAAAAAElFTkSuQmCC');}

    /* Sorcière Violette - Le design du dessin */
    .sprite-sorciere { width: 96px; height: 128px; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAYAAAAICAMAAAAO/ML8AAAAAXNSR0IArs4c6QAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAAD1QTFRFAAAA////AABmAGb//5mZ//+ZmczMM5nMzMzMmcz/mf9mM//M//+ZAGbMmf//ZsyZAGZmMwAzzP8AAH54T94AAAAlklEQVR4nGNiYGRiYAQTDEwMDEwMTAwMIIshGBYmCJYmCJYmCADHwAMX/L5xXQAAAABJFTkSuQmCC');}

    /* Dragon de la Tristesse */
    .sprite-dragon { width: 160px; height: 160px; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAICAMAAADvH7G8AAAAAXNSR0IArs4c6QAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAADtQTFRFAAAAmf//AABmZv9m/2b/ZmZmZmaZAABmzP/MzMzMZv+Zmf+ZmWZm/8zMzABmAGYzzADMMwAzADMzAFXl9kAAAAAkklEQVR4nGFgYGRkYAQTDAxMTIxiAiaYACyIQYwgyMREgSIAAXQACgGqg68AAAAASFTkSuQmCC');}

    /* Croissant Empoisonné */
    .sprite-croissant { width: 64px; height: 64px; background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAMAAADz0U65AAAAAXNSR0IArs4c6QAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAAB1QTFRF////AAD/ZmZmzMz//5mZmZlmZswAAAD/MzMz0O90bAAAAA10Uk5TAAAAAACZmf8A/wAAAI6lZ7wAAAAidklEQVR4nGNgYGRiYAQTTAwMTGBigggIAUQQASFAghgIALDAAxT/RCHtAAAAAElFTkSuQmCC'); animation: bounce 0.5s infinite alternate;}

    @keyframes bounce { from { transform: translateY(0) scale(1); } to { transform: translateY(-10px) scale(1.02); } }

    /* DÉCORS */
    .stars { background: radial-gradient(white 1px, transparent 1px); background-size: 20px 20px; animation: moveStars 100s linear infinite; }
    @keyframes moveStars { from { background-position: 0 0; } to { background-position: 1000px 5000px; } }
    
    .flowers-bg { background: #601a35; }
    
    .beach-bg { background: linear-gradient(to bottom, #1e90ff, #87ceeb 50%, #f0e68c 50%, #edc9af); }
    .wave { position: absolute; width: 200%; height: 20px; background: rgba(255,255,255,0.3); top: 52%; animation: waveMove 4s infinite linear; z-index: 1;}
    @keyframes waveMove { from { left: -100%; } to { left: 0; } }

    /* UI Elements */
    .health-bar-bg { border: 3px solid #fff; background: #000; width: 100px; height: 15px; }
    .health-fill { background: lime; height: 100%; transition: width 0.3s; }
  </style>
</head>
<body>
<div id="game"></div>

<script>
let currentScene = 0;
let enemyHP = 150;
let playerHP = 100;
let dragonHP = 15;
let isBusy = false;

const scenes = [
{
  bg: 'stars',
  content: `
    <div class="dialogue" style="color:#00ffcc; border-color:#00ffcc;">
      Né en Allemagne et élevé à Brive, Tyron a tracé son propre chemin.<br><br>
      Fils d'un père dont il a hérité la précision chinoise, il a su s'affranchir du passé pour devenir l'homme qu'il est aujourd'hui : un colosse autonome et fier.<br><br>
      Un guerrier Nak Muay capable de briser des planches, mais dont le cœur bat plus fort que ses poings.
    </div>`
},
{
  content: `
    <div class="pixel-sprite sprite-tyron"></div>
    <div class="dialogue">
      Avec sa guilde légendaire (Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste), Tyron est le pilier sur lequel tout le monde s'appuie.<br><br>
      Derrière ses muscles de boxeur et son armure d'ingénieur, il reste ce géant sensible, toujours prêt pour un éclat de rire ou une discussion profonde.
    </div>`
},
{
  content: `
    <div class="pixel-sprite sprite-tanguy"></div>
    <div class="dialogue">
      Arrivé à l'ICAM, le danger surgit... <b>TANGUY LE SORCIER MUSCLÉ</b> bloque le passage.<br><br>
      "Tyron... je t'attendais. Tes épaules me barrent l'horizon, et mon cœur s'emballe... de haine ! Oui, c'est ça, de haine ! Je vais te réduire en poussière pour que tu ne puisses plus m'ignorer !"
    </div>`
},
{
  id: "battle",
  content: `
    <div style="background:#222; border:4px solid white; padding:10px; width:90%; position:relative; display:flex; flex-direction:column; align-items:center;">
      <div style="display:flex; justify-content:space-between; font-size:8px; width:100%;">
        <div>TYRON: <div class="health-bar-bg"><div class="health-fill" id="pHP-fill" style="width:100%"></div></div></div>
        <div>TANGUY: <div class="health-bar-bg"><div class="health-fill" id="eHP-fill" style="width:100%"></div></div></div>
      </div>
      <div class="pixel-sprite sprite-tanguy" style="width:64px; height:85px; margin: 10px 0;"></div>
      <p id="log" style="font-size:8px; color:yellow; height:30px; text-align:center;">Tanguy bombe le torse avec une intensité suspecte...</p>
      <div id="battle-btns">
        <button onclick="fight('kick')">KICK DE MUAY THAÏ</button>
        <button onclick="fight('look')">REGARD INTENSE</button>
        <button onclick="fight('whey')" style="background:#fff">BOIRE WHEY (+30HP)</button>
      </div>
    </div>`
},
{
  content: `
    <div class="pixel-sprite sprite-tanguy"></div>
    <div class="dialogue">
      Tanguy, à bout de souffle : "Ta force... ton charisme... c'est trop pour moi Tyron. Je pars faire des pompes pour t'oublier !".<br><br>
      Tyron retrouve la team ICAM (Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan et Quentin). Le vrai boss est arrivé.
    </div>`
},
{
  bg: 'flowers-bg',
  content: `
    <div style="display:flex; justify-content:center; gap:20px; margin-bottom:20px;">
        <div class="pixel-sprite sprite-tyron" style="width:64px; height:85px;"></div>
        <div class="pixel-sprite sprite-princesse" style="width:64px; height:85px; animation-delay:0.5s;"></div>
    </div>
    <div class="dialogue" style="color:#ff69b4; border-color:#ff69b4;">
        🌻 LA RENCONTRE DU DESTIN 🌻<br><br>
        Devant le parvis de l'église, le temps sembla se figer. Tyron, le colosse de Brive, sentit une aura inhabituelle.<br><br>
        Soudain, elle apparut. Une Princesse Rousse aux yeux verts, éclatante comme une aube corrézienne.<br><br>
        Lui, qui savait gérer le stress d'un ring et la rigueur de l'ICAM, se sentit soudain plus timide qu'un premier jour d'école.<br><br>
        C'était plus qu'un coup de foudre : c'était une évidence. Le guerrier venait de trouver sa muse.
    </div>`
},
{
  bg: 'beach-bg',
  content: `
    <div class="wave"></div>
    <div class="pixel-sprite sprite-tyron" style="position:relative; z-index:2;"></div>
    <div id="dress-area" style="position:relative; width:100%; display:flex; flex-direction:column; align-items:center; z-index:3;">
        <div class="dialogue">Séparés par les mers ! Philippines vs Madrid.<br>Tyron doit choisir le look ultime pour rester dans son cœur.</div>
        <div id="dress-btns-container" style="margin-top:10px;">
            <button onclick="animateResponse(this, 'Trop timide !', false)">Maillot Classique</button>
            <button onclick="animateResponse(this, 'STYLE PIXEL ABSOLU !', true)">PERRUQUE ROSE & GANTS</button>
            <button onclick="animateResponse(this, 'Tanguy valide, pas elle !', false)">Torse nu huilé</button>
        </div>
    </div>`
},
{
  id: "poison-scene",
  content: `
    <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px;">
        <div class="pixel-sprite sprite-sorciere"></div>
        <div class="pixel-sprite sprite-croissant"></div>
        <div class="pixel-sprite sprite-princesse" style="animation-delay:0.7s;"></div>
    </div>
    <div class="dialogue" style="border-color:#ff0000; color:#ff0000; animation: shake 0.5s;">
      <b>ALERTE ALLERGIE !</b><br><br>
      La Sorcière Violette a frappé par pure jalousie (ou vengeance de Tanguy ?).<br><br>
      Elle a sournoisement empoisonné la Princesse... avec un <b>croissant aux amandes</b> ! Foutues allergies !<br><br>
      La Princesse s'effondre dans un sommeil léthargique. Tyron, venge ton amour !
    </div>`
},
{
  content: `
    <div class="pixel-sprite sprite-dragon"></div>
    <div class="dialogue">
      Le Dragon de la Tristesse protège le croissant-remède (oui, c'est conceptuel) !<br>Utilise ta puissance de Nak Muay pour le vaincre !
    </div>
    <button id="atk-dragon">🥊 KICK PIXEL (<span id="dHP">15</span>)</button>`
},
{
  bg: 'stars',
  content: `
    <div style="display:flex; justify-content:center; gap:10px; margin-bottom:10px;">
        <div class="pixel-sprite sprite-tyron" style="width:48px; height:64px;"></div>
        <div class="pixel-sprite sprite-princesse" style="width:48px; height:64px;"></div>
    </div>
    <div style="color:#ffd700; text-shadow:2px 2px pink; line-height: 1.5; font-size:12px;">
      👑 L'UNION DES MONDES 👑<br><br>
      Le Dragon est vaincu, le sort est rompu, l'allergie est guérie !<br><br>
      Tyron l'Allemand, l'enfant de Brive, le boxeur au cœur tendre, a prouvé que la vraie virilité réside dans la capacité à protéger ceux qu'on aime avec douceur.<br><br>
      <b>RÉCOMPENSE :</b> LA MONTRE DE SPORT ÉTERNELLE ET UN AMOUR INFINI.<br><br>
      JOYEUX ANNIVERSAIRE TYRON !
    </div>`
}
];

// --- Fonctions inchangées ---
function renderScene() {
  const game = document.getElementById("game");
  let scene = scenes[currentScene];
  game.className = scene.bg || "";
  game.innerHTML = `<div class="scene active" id="scene-root">${scene.content}${shouldShowBtn() ? '<button onclick="nextScene()">CONTINUER</button>' : ''}</div>`;
  if(currentScene === 8) document.getElementById('atk-dragon').onclick = attackDragon;
}

function shouldShowBtn() {
  return currentScene < scenes.length-1 && currentScene !== 3 && currentScene !== 6 && currentScene !== 8;
}

function nextScene() { currentScene++; renderScene(); }

function fight(type) {
  if(isBusy) return;
  isBusy = true;
  const log = document.getElementById("log");
  const btns = document.getElementById("battle-btns").querySelectorAll("button");
  btns.forEach(b => b.disabled = true);
  
  if(type === 'kick') { enemyHP -= 25; log.innerText = "Tyron assène un middle-kick dévastateur !"; }
  else if(type === 'look') { enemyHP -= 45; log.innerText = "Tyron dévoile sa grande sensibilité... Tanguy est troublé !"; }
  else if(type === 'whey') { playerHP = Math.min(100, playerHP + 40); log.innerText = "Tyron récupère avec un shaker de Whey pure !"; }

  updateBars();
  
  setTimeout(() => {
    if(enemyHP <= 0) {
      log.innerText = "Tanguy : 'Incroyable... tant de muscles et tant d'émotion...'";
      setTimeout(nextScene, 2000);
    } else {
      const moves = ["Tanguy lance 'ERREUR DE SYNTAXE' !", "Tanguy invoque 'RÉSISTANCE AU CHARISME' !"];
      const move = moves[Math.floor(Math.random()*moves.length)];
      playerHP -= 15;
      log.innerText = move;
      updateBars();
      isAttacking = false;
      if(playerHP <= 0) { alert("Tyron doit se reposer..."); location.reload(); }
      setTimeout(() => { isBusy = false; btns.forEach(b => b.disabled = false); }, 500);
    }
  }, 1500);
}

function updateBars() {
  document.getElementById("pHP-fill").style.width = playerHP + "%";
  document.getElementById("eHP-fill").style.width = (enemyHP/150*100) + "%";
}

function animateResponse(btn, text, isCorrect) {
  const floating = document.createElement('div');
  floating.className = 'floating-text';
  floating.innerText = text;
  floating.style.left = btn.offsetLeft + "px";
  floating.style.top = btn.offsetTop + "px";
  document.getElementById('dress-area').appendChild(floating);
  
  if(isCorrect) setTimeout(nextScene, 2000);
}

function attackDragon() {
  dragonHP--;
  document.getElementById("dHP").innerText = dragonHP;
  document.getElementById("dragon-box").style.transform = "scale(1.2) rotate(10deg)";
  setTimeout(() => { if(document.getElementById("dragon-box")) document.getElementById("dragon-box").style.transform = "scale(1)"; }, 150);
  if(dragonHP <= 0) nextScene();
}

// Lancement
renderScene();
</script>

<style>
@keyframes shake {
  0% { transform: translate(1px, 1px); }
  50% { transform: translate(-1px, -1px); }
  100% { transform: translate(1px, -1px); }
}
</style>
</body>
</html>
