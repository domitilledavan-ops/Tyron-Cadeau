<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyron : Le Chevalier au Cœur de Soie</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Press Start 2P', cursive;
      background: #050505; color: white; overflow: hidden;
    }

    #game { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    .scene { position: absolute; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; z-index: 5; animation: fadeIn 0.8s; }
    .active { display: flex; }

    .dialogue { background: rgba(0,0,0,0.9); border: 4px solid #fff; padding: 15px; max-width: 85%; line-height: 1.6; font-size: 10px; margin-top: 15px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    button { margin: 5px; padding: 10px; font-family: inherit; background: #ffea00; border: 3px solid #000; cursor: pointer; font-size: 8px; }
    button:hover { background: #ffae00; transform: translateY(-2px); }

    /* TYRON PIXEL ART BADASS */
    .tyron-pixel { position: relative; width: 100px; height: 150px; animation: idle 1s infinite alternate; }
    .t-helmet { width: 50px; height: 45px; background: #444; position: absolute; top: 10px; left: 25px; border: 3px solid #000; border-radius: 5px; }
    .t-visor { width: 40px; height: 10px; background: #00ffff; position: absolute; top: 15px; left: 5px; border: 2px solid #000; }
    .t-body { width: 60px; height: 70px; background: #228b22; position: absolute; top: 55px; left: 20px; border: 3px solid #000; }
    .t-shoulder { width: 25px; height: 25px; background: #666; position: absolute; top: 55px; border: 3px solid #000; }
    .t-l { left: 0; } .t-r { right: 0; }
    .t-belt { width: 60px; height: 10px; background: #ffd700; position: absolute; top: 90px; left: 0; border-top: 2px solid #000; }
    
    @keyframes idle { from { transform: translateY(0); } to { transform: translateY(-5px); } }

    /* DÉCORS ET ANIMATIONS */
    .beach-bg { background: linear-gradient(to bottom, #1e90ff, #87ceeb 50%, #f0e68c 50%, #edc9af); }
    .wave { position: absolute; width: 200%; height: 20px; background: rgba(255,255,255,0.3); top: 52%; animation: waveMove 4s infinite linear; }
    @keyframes waveMove { from { left: -100%; } to { left: 0; } }
    
    .sun { position: absolute; top: 50px; right: 50px; width: 80px; height: 80px; background: #ffdf00; border-radius: 50%; box-shadow: 0 0 50px orange; }

    @keyframes crawl { 0% { top: 100%; } 100% { top: -150%; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
<div id="game"></div>

<script>
let currentScene = 0;
let enemyHP = 150;
let playerHP = 100;
let dragonHP = 15;
let stylePoints = 0;

const scenes = [
{
  bg: 'stars',
  content: `
    <div style="color:#00ffcc; text-shadow:2px 2px #000; line-height:1.6; font-size:11px;">
      Né en Allemagne, forgé à Brive, Tyron est l'ultime fusion génétique :<br><br>
      La précision millimétrée de son père Chinois et l'énergie solaire de sa mère Philippine.<br><br>
      Un colosse dont la carrure ferait passer un tank pour une trottinette, mais dont la sensibilité est si grande qu'il s'excuse auprès des mouches avant de les chasser.
    </div>`
},
{
  content: `
    <div class="tyron-pixel">
      <div class="t-helmet"><div class="t-visor"></div></div>
      <div class="t-shoulder t-l"></div><div class="t-shoulder t-r"></div>
      <div class="t-body"><div class="t-belt"></div></div>
    </div>
    <div class="dialogue">
      Tyron et sa guilde (Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste) règnent sur la Corrèze.<br><br>
      On raconte qu'il peut soulever trois potes d'un bras tout en récitant de la poésie allemande. Un homme qui en impose, un pilier, un roc... mais un roc qui fait des câlins.
    </div>`
},
{
  content: `
    <div class="dialogue">
      À l'ICAM, l'air devient électrique. <b>TANGUY LE SORCIER</b> apparaît, les abdos luisants.<br><br>
      "Tyron... enfin tu es là. Ton métissage te donne un charme... euh, une puissance insupportable ! Je vais devoir te combattre, même si mes yeux refusent de te quitter !"
    </div>`
},
{
  id: "battle",
  content: `
    <div style="background:#222; border:4px solid white; padding:10px; width:90%;">
      <div style="display:flex; justify-content:space-between; font-size:8px;">
        <div>TYRON: <span id="pHP">100</span>%</div>
        <div>TANGUY (Troublé): <span id="eHP">100</span>%</div>
      </div>
      <div style="font-size:40px; margin:10px;">🧙‍♂️❤️</div>
      <p id="log" style="font-size:8px; color:yellow;">Tanguy ajuste sa cape en rougissant.</p>
      <button onclick="fight('kick')">COMBO MANILLE-PÉKIN</button>
      <button onclick="fight('brive')">UPPERCUT DE BRIVE</button>
      <button onclick="fight('look')">REGARD TÉNÉBREUX</button>
    </div>`
},
{
  content: `
    <div class="dialogue">
      Tanguy s'avoue vaincu : "Ta force me submerge, Tyron... on se voit à la douche ? Enfin, à la muscu !".<br><br>
      Tyron rejoint alors Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan et Quentin pour une session de travail... ou de sieste collective.
    </div>`
},
{
  bg: 'stars',
  content: `
    <div style="height:200px; overflow:hidden; position:relative;">
      <div style="position:absolute; width:100%; animation: crawl 15s linear forwards; color:#ff69b4;">
        🌸 🏮 🌸<br>Devant l'église,<br>Tyron le guerrier chinois-philippin<br>sentit son âme vaciller.<br>🌸 🏮 🌸<br>
        Une Princesse Rousse,<br>aux yeux d'émeraude,<br>venait de capturer son cœur.<br>🌸 🏮 🌸<br>
        Lui, le boxeur de Brive,<br>ne savait plus comment<br>simplement dire "Bonjour".
      </div>
    </div>`
},
{
  bg: 'beach-bg',
  content: `
    <div class="sun"></div><div class="wave"></div><div class="crab" style="bottom:15%">🦀</div>
    <div class="dialogue">
      Séparés par les océans ! Madrid vs Philippines.<br><br>
      Entre deux entraînements de Muay Thaï, Tyron doit prouver qu'il est le plus stylé de l'archipel pour séduire sa belle à distance.
    </div>
    <button onclick="dressGame()">DRESS TO IMPRESS</button>`
},
{
  content: `
    <div class="dialogue">
      CATÉSTROPHIQUE ! Une sorcière jalouse (ou peut-être un ex de Tanguy) a empoisonné la Princesse avec un croissant aux amandes !<br><br>
      Elle dort d'un sommeil profond. Seul un enchaînement de boxe parfait peut la sauver !
    </div>`
},
{
  content: `
    <div style="font-size:70px; animation: bounce 0.5s infinite;">🐉</div>
    <div class="dialogue">LE DRAGON DE LA TRISTESSE !<br>Frappe avec la force de tes ancêtres !</div>
    <button id="atk-dragon">🥊 KICK PHILIPPIN (<span id="dHP">15</span>)</button>`
},
{
  bg: 'stars',
  content: `
    <div style="color:#ffd700; text-shadow:2px 2px #f00;">
      👑 VICTOIRE TOTALE 👑<br><br>
      Tyron a sauvé sa Princesse !<br><br>
      D'Allemagne à Brive, de la Chine aux Philippines, il est le Chevalier Ultime.<br><br>
      <b>CADEAU :</b> LA MONTRE DE SPORT LÉGENDAIRE.<br><br>
      JOYEUX ANNIVERSAIRE TYRON !
    </div>`
}
];

function renderScene() {
  const g = document.getElementById("game");
  let s = scenes[currentScene];
  g.className = s.bg || "";
  g.innerHTML = `<div class="scene active">${s.content}${shouldShowBtn() ? '<button onclick="nextScene()">CONTINUER</button>' : ''}</div>`;
  if(currentScene === 8) document.getElementById('atk-dragon').onclick = attackDragon;
}

function shouldShowBtn() { return ![3, 6, 8, 9].includes(currentScene); }
function nextScene() { currentScene++; renderScene(); }

function fight(type) {
  const log = document.getElementById("log");
  if(type === 'kick') { enemyHP -= 30; log.innerText = "Tyron frappe ! Tanguy : 'Oh oui... euh, aïe !'"; }
  if(type === 'brive') { enemyHP -= 25; log.innerText = "La puissance de Brive ! Tanguy est étourdi par ton odeur de virilité."; }
  if(type === 'look') { enemyHP -= 50; log.innerText = "Tyron baisse la visière et regarde Tanguy. Tanguy s'évanouit de désir."; }
  
  document.getElementById("eHP").innerText = Math.max(0, enemyHP);
  if(enemyHP <= 0) setTimeout(nextScene, 1500);
}

function dressGame() {
  const g = document.getElementById("game");
  g.innerHTML = `
    <div class="scene active beach-bg">
      <div class="sun"></div><div class="wave"></div>
      <div class="dialogue">Choisis le combo gagnant :</div>
      <button onclick="alert('Trop timide !');">Short de bain délavé</button>
      <button onclick="alert('STYLE DIVIN !'); nextScene();">PERRUQUE ROSE + GANTS DE BOXE</button>
      <button onclick="alert('Tanguy aimerait, mais pas la Princesse !');">Armure complète sans rien dessous</button>
    </div>`;
}

function attackDragon() {
  dragonHP--;
  document.getElementById("dHP").innerText = dragonHP;
  if(dragonHP <= 0) nextScene();
}

renderScene();
</script>
</body>
</html>
