<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tyron : La Quête du Chevalier</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    /* DESIGN RETRO - ON GARDE TES COULEURS */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Press Start 2P', cursive; background: #050505; color: white; overflow: hidden; }
    #game { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    
    .scene { position: absolute; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; animation: fadeIn 0.8s; }
    .active { display: flex; }

    /* CADRE PHOTO - SI L'IMAGE MANQUE, CA RESTE JOLI */
    .img-box {
        width: 250px; height: 250px;
        border: 4px solid #fff;
        box-shadow: 0 0 15px rgba(255, 0, 234, 0.5);
        margin-bottom: 20px;
        background: #222; /* Fond gris foncé si image pas là */
        display: flex; align-items: center; justify-content: center;
    }
    .img-box img { width: 100%; height: 100%; object-fit: cover; }

    .dialogue { background: rgba(0,0,0,0.9); border: 4px solid #fff; padding: 15px; max-width: 85%; line-height: 1.6; font-size: 10px; margin-top: 15px; }
    button { margin: 10px; padding: 10px; font-family: inherit; background: #ffea00; border: 3px solid #000; cursor: pointer; font-size: 8px; }
    
    .flowers-bg { background: #601a35; }
    .crawl-container { width: 80%; height: 60%; perspective: 400px; overflow: hidden; }
    .crawl-content { position: relative; animation: crawl 25s linear forwards; color: #ffb6c1; line-height: 2.2; font-size: 11px; text-align: center; }
    
    @keyframes crawl { 0% { top: 100%; transform: rotateX(20deg); } 100% { top: -200%; transform: rotateX(20deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
<div id="game"></div>

<script>
let currentScene = 0;

const scenes = [
  { // 1. INTRODUCTION
    content: `
      <div class="dialogue">
        Né en Allemagne et élevé à Brive, Tyron porte un héritage puissant.<br><br>
        Il a des racines philippines par sa mère... on ne s'attardera pas sur elle (elle n'était pas sympa).<br><br>
        C'est un guerrier Nak Muay au mental d'acier !
      </div>`
  },
  { // 2. TYRON ET SA GUILDE
    content: `
      <div class="img-box"><img src="tyron.png" onerror="this.style.display='none'">[IMAGE TYRON]</div>
      <div class="dialogue">
        À Brive avec sa guilde : Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste.<br><br>
        Pas encore ingénieur, mais déjà un vrai pilier !
      </div>`
  },
  { // 3. TANGUY LE SORCIER
    content: `
      <div class="img-box"><img src="tanguy.png" onerror="this.style.display='none'">[IMAGE TANGUY]</div>
      <div class="dialogue">
        À l'ICAM, <b>TANGUY LE SORCIER</b> bloque le passage...<br><br>
        "Tes épaules barrent l'horizon, Tyron ! C'est criminel d'être aussi imposant. Je vais te combattre !" (En fait, il t'aime bien).
      </div>`
  },
  { // 4. EGLISE (SCENE ROSE)
    bg: "flowers-bg",
    content: `
      <div class="crawl-container">
        <div class="crawl-content">
          🌸 LA RENCONTRE DU DESTIN 🌸<br><br>
          Devant le parvis de l'église, le temps s'arrêta.<br>
          Tyron vit une Princesse Rousse aux yeux verts.<br>
          Plus belle qu'un high-kick parfait.<br>
          Leur regards se croisèrent...
        </div>
      </div>`
  },
  { // 5. LA SORCIERE VIOLETTE
    content: `
      <div class="img-box"><img src="sorciere.png" onerror="this.style.display='none'">[IMAGE SORCIERE]</div>
      <div class="dialogue" style="border-color:#ff00ea; color:#ff00ea;">
        <b>DRAME !</b> La Sorcière Violette a frappé !<br><br>
        Elle a empoisonné la Princesse avec un <b>croissant aux amandes</b> !<br><br>
        FOUTUES ALLERGIES !
      </div>`
  }
];

function render() {
  const g = document.getElementById("game");
  let s = scenes[currentScene];
  g.className = s.bg || "";
  g.innerHTML = `<div class="scene active">${s.content}<br><button onclick="next()">CONTINUER</button></div>`;
}

function next() {
  currentScene++;
  if(currentScene < scenes.length) render();
  else alert("FIN DE L'AVENTURE ! JOYEUX ANNIVERSAIRE !");
}

render();
</script>
</body>
</html>
