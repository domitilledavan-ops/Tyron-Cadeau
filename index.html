<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyron Saga : La Quête du Chevalier</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
        body { font-family: 'Press Start 2P', cursive; background: #050505; color: white; overflow: hidden; transition: background 0.2s; }
        #game { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .scene { position: absolute; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; animation: fadeIn 0.5s; }
        .active { display: flex; }

        .img-box {
            width: 250px; height: 250px;
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            background: #222;
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        .img-battle-large { width: 180px !important; height: auto; margin: 10px 0; }

        .dialogue { background: rgba(0,0,0,0.9); border: 4px solid #fff; padding: 15px; max-width: 85%; line-height: 1.6; font-size: 10px; margin-top: 15px; text-align: left; }
        button { margin: 10px; padding: 12px; font-family: inherit; background: #ffea00; border: 3px solid #000; cursor: pointer; font-size: 8px; }
        button:hover { background: #fff; }

        .battle-ui { width: 95%; max-width: 550px; background: #f8f8f8; color: #333; border: 4px solid #555; border-radius: 10px; padding: 15px; text-align: left; }
        .hp-bar { height: 12px; background: #ccc; border: 2px solid #333; width: 100%; margin: 5px 0; }
        .hp-fill { height: 100%; background: #4caf50; transition: width 0.3s; }
        .battle-text { height: 70px; font-size: 8px; color: #000; background: #fff; padding: 10px; border: 2px solid #333; margin-top: 10px; }

        #kiss-zone { width: 300px; height: 180px; border: 4px dashed #ff00ea; position: relative; margin: 20px; background: rgba(255,0,234,0.1); }
        .papa-icon { position: absolute; right: 10px; top: 10px; font-size: 18px; transition: 0.2s; }
        
        .flowers-bg { background: #601a35; }
        .beach-bg { background: linear-gradient(#1e90ff, #f0e68c); }
        .warning { background: #ff4d4d !important; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="game"></div>

<script>
let currentScene = 0;
let playerHP = 100;
let enemyHP = 150;
let isBusy = false;
let kissProgress = 0;
let papaLooking = false;

const tanguyLines = [
    "Tanguy : 'Frappe-moi encore Tyron, ton charisme m'éblouit !'",
    "Tanguy rougit : 'C'est criminel d'avoir des dorsaux pareils...'",
    "Tanguy : 'Est-ce que tu penses à moi pendant tes tractions ?'",
    "Tanguy : 'Ta rigueur chinoise me rend tout chose...'",
    "Tanguy : 'Si je gagne, on partage un shaker en tête-à-tête ?'",
    "Tanguy : 'Tu es le seul ingénieur qui fait battre mon cœur !'",
    "Tanguy : 'Vise le torse, Tyron... j'aime quand tu es direct !'"
];

const scenes = [
    { 
        content: `<div class="dialogue"><b>L'HÉRITAGE DU CHEVALIER</b><br><br>Né sous le ciel d'Allemagne et forgé dans les terres de Brive, Tyron est le fruit d'un mélange explosif.<br><br>De son père, il a hérité de la <b>Rigueur Chinoise</b> et d'un sens du devoir implacable. Quant à ses racines <b>Philippines</b>... disons que c'est complexe.<br><br>On ne va pas s'attarder sur sa génitrice, car elle n'était pas très sympa. Mais Tyron a prouvé sa force mentale légendaire en prenant ses distances. Un vrai colosse ne se laisse pas abattre par le passé !</div>`
    },
    { 
        content: `<div class="img-box"><img src="tyron.png" onerror="this.parentElement.innerHTML='[IMAGE TYRON]'"></div><div class="dialogue"><b>LA GUILDE DE BRIVE</b><br><br>Avant de devenir le futur ingénieur de l'ICAM, Tyron règne sur sa guilde briviste : Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste.<br><br>Entre deux séances de boxe, il mène ses troupes avec une main de fer dans un gant de soie (et beaucoup de Whey). Mais un rival de taille se dresse sur sa route...</div>`
    },
    { 
        id: "battle-tanguy",
        content: `
            <div class="battle-ui">
                <p style="font-size:7px">SORCIER TANGUY (Secrètement Amoureux)</p>
                <div class="hp-bar"><div id="eHP" class="hp-fill" style="width:100%"></div></div>
                <div style="text-align:center"><img src="tanguy.png" class="img-battle-large" onerror="this.parentElement.innerHTML='<div style=font-size:40px>🧙‍♂️</div>'"></div>
                <p style="font-size:7px; text-align:right">TYRON (Niv. 25 - Go Muscu)</p>
                <div class="hp-bar"><div id="pHP" class="hp-fill" style="width:100%"></div></div>
                <div id="battleText" class="battle-text">TANGUY bloque le passage ! Il veut ton attention (et peut-être un bisou) !</div>
                <div style="display:grid; grid-template-columns:1fr 1fr;">
                    <button onclick="fight('kick', 'tanguy')">KICK BOXE</button>
                    <button onclick="fight('regard', 'tanguy')">CHARISME CHINOIS</button>
                    <button onclick="fight('whey', 'tanguy')">WHEY MAGIQUE</button>
                    <button onclick="fight('fuite', 'tanguy')">FUITE</button>
                </div>
            </div>`
    },
    { 
        bg: "beach-bg",
        content: `
            <div class="dialogue"><b>L'ÉPREUVE DU STYLE : DRESS TO IMPRESS</b><br><br>Le destin appelle Tyron vers d'autres horizons : de Madrid aux Philippines.<br><br>Pour conquérir le cœur de sa dulcinée à distance, il doit valider son look. Choisissez avec soin, car la Princesse a des goûts... particuliers.</div>
            <div id="dress-area">
                <button onclick="alert('Trop banal ! Tyron mérite plus d\\'extravagance !')">MAILLOT CLASSIQUE</button>
                <button onclick="alert('LE LOOK ULTIME ! La perruque rose souligne tes trapèzes !'); nextScene()">PERRUQUE ROSE & ROBE</button>
                <button onclick="alert('Tanguy le Sorcier aurait adoré... mais la Princesse trouve ça glissant !')">CORPS NU HUILÉ</button>
            </div>`
    },
    { 
        bg: "flowers-bg",
        content: `<div class="img-box" style="border-radius:50%; border:8px solid gold; overflow:hidden;"><img src="princesse.png" style="width:100%; height:100%; object-fit:cover;" onerror="this.parentElement.innerHTML='[IMAGE PRINCESSE]'"></div><div class="dialogue"><b>L'APPARITION</b><br><br>Soudain, l'univers bascule. Un coup de foudre sauvage frappe Tyron en plein plexus !<br><br>Une chevelure rousse comme un coucher de soleil, des yeux verts perçants comme deux émeraudes... La Princesse est là, et le monde s'arrête de tourner.</div>`
    },
    { 
        bg: "flowers-bg",
        content: `<div class="dialogue"><b>LE PARVIS DE L'AMOUR</b><br><br>Devant le parvis de l'église, le temps se fige. Tyron, le boxeur au cœur d'acier, sent son armure se briser.<br><br>Ce n'est pas un combat, c'est une reddition. Mais le bonheur est de courte durée... une ombre plane sur cette rencontre idyllique.</div>`
    },
    { 
        content: `<div class="img-box"><img src="sorciere.png" onerror="this.parentElement.innerHTML='[IMAGE SORCIERE]'"></div><div class="dialogue" style="border-color:#ff00ea; color:#ff00ea;"><b>LA TRAHISON VIOLETTE</b><br><br>La Sorcière Violette, ivre de jalousie, lance son sort le plus cruel : <b>L'ALLERGIE MORTELLE</b> !<br><br>Elle fait apparaître un croissant aux amandes enchanté. La Princesse croque... et s'effondre dans un sommeil profond. Tyron doit agir !</div>`
    },
    { 
        id: "battle-dragon",
        content: `
            <div class="battle-ui">
                <p style="font-size:7px; color:red;">DRAGON DE LA TRISTESSE</p>
                <div class="hp-bar"><div id="eHP-dragon" class="hp-fill" style="width:100%; background:red;"></div></div>
                <div style="text-align:center"><img src="dragon.png" class="img-battle-large" onerror="this.parentElement.innerHTML='<div style=font-size:40px>🐲</div>'"></div>
                <p style="font-size:7px; text-align:right">TYRON (LE SAUVEUR)</p>
                <div class="hp-bar"><div id="pHP-dragon" class="hp-fill" style="width:100%"></div></div>
                <div id="battleText-dragon" class="battle-text">Le Dragon pleure des larmes de feu ! Il veut empêcher Tyron d'atteindre sa bien-aimée !</div>
                <div style="display:grid; grid-template-columns:1fr 1fr;">
                    <button onclick="fight('kick', 'dragon')">KICK DE LA JUSTICE</button>
                    <button onclick="fight('whey', 'dragon')">BOIRE LE SHAKER</button>
                </div>
            </div>`
    },
    { 
        content: `
            <div class="dialogue"><b>LE BAISER DU RÉVEIL</b><br><br>Le Dragon est vaincu, mais la Princesse dort toujours.<br><br>Tyron doit briser le sort avec un baiser sincère... mais attention ! Le Papa de la Princesse surveille les alentours, et il n'est pas prêt à voir son gendre en perruque rose !</div>
            <div id="kiss-zone">
                <div id="papa" class="papa-icon">👴💤</div>
                <div style="position:absolute; bottom:10px; width:100%; padding:0 10px;">AMOUR : <div class="hp-bar"><div id="love-fill" class="hp-fill" style="width:0%; background:#ff00ea;"></div></div></div>
            </div>
            <button onmousedown="startKiss()" onmouseup="stopKiss()" onmouseleave="stopKiss()">EMBRASSER 💋</button>`
    },
    { 
        bg: "flowers-bg",
        content: `<div class="dialogue" style="border:8px double gold;">👑 <b>L'APOTHÉOSE DU CHEVALIER</b> 👑<br><br>Tyron ! Tu as triomphé des préjugés, du sorcier Tanguy, des croissants aux amandes et de la tristesse !<br><br>Ta force et ton style divin ont sauvé la Princesse. Pour te récompenser de tes exploits et de ton futur diplôme à l'ICAM...<br><br>🎁 <b>CADEAU LÉGENDAIRE :</b><br>LA MONTRE DE SPORT CONNECTÉE (Pour tracker tes futurs K.O) !<br><br>✨ <b>JOYEUX ANNIVERSAIRE TYRON !</b> ✨</div>`
    }
];

function render() {
    const game = document.getElementById("game");
    let s = scenes[currentScene];
    game.className = s.bg || "";
    game.innerHTML = `<div class="scene active">${s.content}${shouldShowBtn() ? '<br><button onclick="nextScene()">CONTINUER L\\'AVENTURE</button>' : ''}</div>`;
    if(currentScene === 2 || currentScene === 7) { enemyHP = 150; playerHP = 100; isBusy = false; }
    if(currentScene === 8) initKissGame();
}

function shouldShowBtn() { return ![2, 3, 7, 8].includes(currentScene); }
function nextScene() { currentScene++; if(currentScene < scenes.length) render(); }

function fight(move, type) {
    if(isBusy) return; isBusy = true;
    const suffix = type === 'dragon' ? '-dragon' : '';
    const txt = document.getElementById("battleText" + suffix);
    
    if(move === 'kick') { enemyHP -= 50; txt.innerText = "Tyron balance un High-Kick magistral !"; }
    else if(move === 'regard') { enemyHP -= 60; txt.innerText = "Tyron contracte les pecs. L'ennemi est pétrifié !"; }
    else if(move === 'whey') { playerHP = Math.min(100, playerHP + 50); txt.innerText = "Une gorgée de Whey et Tyron repart de plus belle !"; }
    else if(move === 'fuite') { txt.innerText = "Fuire ? Avec ces muscles ? Jamais !"; }
    
    updateBars(type);
    
    setTimeout(() => {
        if(enemyHP <= 0) { txt.innerText = "VICTOIRE ÉCRASANTE !"; setTimeout(nextScene, 1200); }
        else {
            txt.innerText = (type === 'tanguy') ? tanguyLines[Math.floor(Math.random()*tanguyLines.length)] : "Le Dragon crache des flammes de mélancolie !";
            playerHP -= 15; updateBars(type); isBusy = false;
        }
    }, 1000);
}

function updateBars(type) {
    const suffix = type === 'dragon' ? '-dragon' : '';
    const eBar = document.getElementById("eHP" + suffix);
    const pBar = document.getElementById("pHP" + suffix);
    if(eBar) eBar.style.width = (enemyHP/150*100) + "%";
    if(pBar) pBar.style.width = playerHP + "%";
}

let kissInterval;
function initKissGame() {
    const gameInt = setInterval(() => {
        if(currentScene !== 8) { clearInterval(gameInt); return; }
        papaLooking = Math.random() > 0.4;
        const p = document.getElementById("papa");
        if(p) { p.innerText = papaLooking ? "👴💢 : JE TE VOIS !" : "👴💤 : *Ronflements*"; p.style.color = papaLooking ? "red" : "white"; }
    }, 1200);
}

function startKiss() {
    kissInterval = setInterval(() => {
        if(papaLooking) { kissProgress = Math.max(0, kissProgress - 5); document.body.classList.add("warning"); }
        else { kissProgress += 4; document.body.classList.remove("warning"); if(kissProgress >= 100) { clearInterval(kissInterval); nextScene(); } }
        const fill = document.getElementById("love-fill");
        if(fill) fill.style.width = kissProgress + "%";
    }, 80);
}
function stopKiss() { clearInterval(kissInterval); document.body.classList.remove("warning"); }

render();
</script>
</body>
</html>
