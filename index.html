<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyron le Chevalier : La Quête de l'ICAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Press Start 2P', cursive;
      background: black;
      color: white;
      overflow: hidden;
    }

    #game {
      width: 100vw; height: 100vh;
      position: relative;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }

    .scene {
      position: absolute;
      width: 100%; height: 100%;
      display: none;
      justify-content: center; align-items: center;
      flex-direction: column;
      text-align: center;
      padding: 30px;
      animation: fadeIn 1s ease-in-out;
      z-index: 5; /* Texte au-dessus des fleurs */
    }

    .active { display: flex; }

    .dialogue {
      background: rgba(0,0,0,0.85);
      border: 4px solid white;
      padding: 20px;
      max-width: 90%;
      line-height: 1.8;
      font-size: 11px;
      margin-top: 20px;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      font-family: inherit;
      background: yellow;
      border: 4px solid black;
      cursor: pointer;
      font-size: 9px;
    }

    button:hover { background: orange; transform: scale(1.05); }

    /* NOUVELLE NARRATION DÉFILANTE */
    .crawl-container {
      width: 80%; height: 60%;
      perspective: 400px;
      overflow: hidden;
    }
    .crawl-content {
      position: relative;
      top: 100%;
      animation: crawl 20s linear forwards;
      color: #ffb6c1;
      line-height: 2;
      font-size: 14px;
      text-align: center;
    }
    @keyframes crawl {
      0% { top: 100%; transform: rotateX(20deg) translateY(0); }
      100% { top: -150%; transform: rotateX(20deg) translateY(-500px); }
    }

    /* DÉCORS */
    .flowers-bg { background: #601a35; position: relative; overflow: hidden; }
    .flower {
      position: absolute; font-size: 30px; z-index: 1;
      animation: float 4s infinite ease-in-out;
    }

    .beach-bg { background: linear-gradient(to bottom, #4da6ff 60%, #ffd700 60%); }
    .palm { position: absolute; bottom: 40%; font-size: 70px; z-index: 1; }
    .crab { position: absolute; bottom: 10%; font-size: 25px; animation: crabWalk 6s infinite linear; z-index: 1; }

    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-30px) rotate(45deg); } }
    @keyframes crabWalk { 0% { left: -10%; } 100% { left: 110%; } }
    @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }

    /* PERSOS */
    .character-container { display: flex; justify-content: center; align-items: center; gap: 60px; margin-top: 20px; }
    .tyron, .princess { position: relative; width: 120px; height: 180px; animation: bounce 1s infinite alternate; }
    
    .tyron .head { width: 50px; height: 50px; background: #f2c28b; position: absolute; top: 20px; left: 35px; border: 4px solid black; }
    .tyron .hat { width: 70px; height: 30px; background: #228b22; position: absolute; top: 0; left: 25px; border: 4px solid black; }
    .tyron .body { width: 80px; height: 80px; background: #228b22; position: absolute; top: 70px; left: 20px; border: 4px solid black; }

    .princess .hair { width: 90px; height: 90px; background: #ff4500; position: absolute; top: 5px; left: 15px; border: 4px solid black; border-radius: 50% 50% 0 0; }
    .princess .head { width: 50px; height: 50px; background: #f2c28b; position: absolute; top: 25px; left: 35px; border: 4px solid black; }
    .princess .body { width: 80px; height: 90px; background: #ff69b4; position: absolute; top: 75px; left: 20px; border: 4px solid black; }

    /* BATTLE UI */
    .battle-ui { border: 4px solid white; padding: 15px; width: 95%; background: #1a1a2e; }
    .hp-box { display: flex; justify-content: space-between; font-size: 9px; margin-bottom: 5px; }
    .hp-bar { width: 100px; height: 10px; background: red; border: 1px solid white; }
    .hp-fill { height: 100%; background: lime; transition: width 0.3s; }
  </style>
</head>
<body>

<div id="game"></div>

<script>
let currentScene = 0;
let enemyHP = 120;
let playerHP = 100;
let dragonHP = 12;

const scenes = [
{
  bg: 'stars',
  content: `
    <div style="color:yellow; text-shadow:2px 2px red; line-height:1.5;">
      DANS UNE GALAXIE... ENFIN, À LILLE...<br><br>
      Le 6 mai 2003 naquit Tyron. Un colosse au regard d'acier, mélange rare de force brute et de finesse chinoise.<br><br>
      Aussi imposant qu'un boxeur thaï en plein "Nak Muay", il cache derrière ses muscles un cœur plus sensible qu'une fin de film Disney.<br><br>
      Tyron : l'homme qui peut te mettre un high-kick, puis pleurer devant un coucher de soleil sur les Philippines.
    </div>`
},
{
  content: `
    <div class="character-container">
      <div class="tyron">
        <div class="hat"></div><div class="head"></div><div class="body"></div>
      </div>
    </div>
    <div class="dialogue">
      Tyron recruta sa première guilde : Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste.<br><br>
      Leur amitié est si forte qu'elle survit aux pires séances de shadow boxing de Tyron dans le salon et à ses moments de "grande émotion" après deux bières.<br><br>
      Le groupe est solide, mais personne n'ose lui dire qu'il chante mal sous la douche.
    </div>`
},
{
  content: `
    <div class="dialogue">
      L'ICAM. Le temple du savoir... et des problèmes.<br><br>
      Soudain, <b>TANGUY LE SORCIER</b> barre la route !<br>
      "Tyron ! Tes origines philippines te donnent du style, mais ma magie va briser ton mental de boxeur !"
    </div>`
},
{
  id: "battle-tanguy",
  content: `
    <div class="battle-ui">
      <div class="hp-box">
        <div>TYRON (Guerrier Sensible): <div class="hp-bar"><div class="hp-fill" id="pHP" style="width:100%"></div></div></div>
        <div>TANGUY (Mage Protéiné): <div class="hp-bar"><div class="hp-fill" id="eHP" style="width:100%"></div></div></div>
      </div>
      <div style="font-size:50px;">🧙‍♂️⚡</div>
      <p id="log" style="font-size:9px; height:30px; margin:10px 0;">Tanguy prépare un sort de 'Lassitude' !</p>
      <div id="btns">
        <button onclick="fight('kick')">HIGH-KICK THAÏ</button>
        <button onclick="fight('math')">INTÉGRALE DE FORCE</button>
        <button onclick="fight('tears')">LARME DE SENSIBILITÉ</button>
        <button onclick="fight('whey')" style="background:white">BOIRE WHEY (+30HP)</button>
      </div>
    </div>`
},
{
  content: `
    <div class="dialogue">
      Tanguy s'enfuit, terrassé par le charisme de Tyron !<br><br>
      Notre héros rejoint ses nouveaux frères d'armes ICAM : Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan et Quentin.<br><br>
      Une équipe prête à tout, surtout à finir les restes de nems de Tyron après l'entraînement.
    </div>`
},
{
  bg: 'flowers-bg',
  content: `
    <div class="flower" style="top:10%; left:5%;">🌸</div>
    <div class="flower" style="top:40%; right:10%;">🌷</div>
    <div class="flower" style="bottom:15%; left:20%;">🌹</div>
    <div class="crawl-container">
      <div class="crawl-content">
        🌻<br>Le destin frappa à la porte de l'église...<br>🌺<br>
        Tyron, le colosse sensible,<br>percuta une vision de rêve...<br>🌼<br>
        Une Princesse Rousse aux yeux verts,<br>plus éclatante qu'une victoire par KO.<br>🌷<br>
        Leur amour commença là,<br>entre deux prières et un sourire.<br>🌸
      </div>
    </div>`
},
{
  bg: 'beach-bg',
  content: `
    <div class="palm" style="left:5%;">🌴</div><div class="crab">🦀</div>
    <div class="dialogue">
      Le destin les sépare ! Madrid vs Philippines.<br><br>
      Tyron, entre deux entraînements de boxe sur le sable fin, réalise que son look "ingénieur-boxeur" a besoin d'un upgrade pour conquérir le monde.<br><br>
      Il est temps de montrer que les Philippins ont le meilleur sens du style du monde !
    </div>
    <button onclick="dressGame()">COMMENCER DRESS TO IMPRESS</button>`
},
{
  content: `
    <div class="dialogue">
      HORREUR ! La Sorcière Violette a frappé par jalousie !<br><br>
      Elle a glissé un poison dans un croissant aux amandes (le point faible de toute princesse).<br><br>
      Seule la défaite du Dragon de la Tristesse peut la réveiller !
    </div>`
},
{
  content: `
    <div class="dragon" id="dragon" style="font-size:80px;">🐉</div>
    <div class="dialogue">
      VITE ! Utilise ta force de boxeur thaï !<br>Clique sur le bouton pour sauver ton amour !
    </div>
    <button id="atk-btn">🥊 BOXER LE DRAGON (<span id="dHP">12</span>)</button>`
},
{
  bg: 'stars',
  content: `
    <div style="color:yellow; text-shadow:2px 2px pink;">
      👑 MARIAGE DE LÉGENDE 👑<br><br>
      Tyron et sa Princesse ont triomphé !<br><br>
      Il a prouvé qu'on peut être un colosse chinois-philippin, champion de boxe, génie de l'ICAM et rester l'homme le plus sensible et aimant du royaume.<br><br>
      <b>OBJET OBTENU :</b> LA MONTRE DE SPORT ÉTERNELLE.<br><br>
      FIN (BRAVO TYRON !)
    </div>`
}
];

function renderScene() {
  const game = document.getElementById("game");
  let scene = scenes[currentScene];
  game.className = scene.bg || "";
  game.innerHTML = `<div class="scene active">${scene.content}${shouldShowBtn() ? '<button onclick="nextScene()">CONTINUER</button>' : ''}</div>`;
  if(currentScene === 8) document.getElementById('atk-btn').onclick = attackDragon;
}

function shouldShowBtn() {
  return currentScene < scenes.length-1 && currentScene !== 3 && currentScene !== 6 && currentScene !== 8;
}

function nextScene() { currentScene++; renderScene(); }

function fight(type) {
  const log = document.getElementById("log");
  if(type === 'kick') { enemyHP -= 30; log.innerText = "KICK DANS LES CÔTES ! Tanguy perd 30 PV !"; }
  if(type === 'math') { enemyHP -= 25; log.innerText = "Calcul complexe ! Tanguy a mal au crâne (-25 PV) !"; }
  if(type === 'tears') { enemyHP -= 40; log.innerText = "Tyron pleure de sincérité... Tanguy est déstabilisé (-40 PV) !"; }
  if(type === 'whey') { playerHP = Math.min(100, playerHP + 30); log.innerText = "Shaker de force ! Tyron reprend 30 PV !"; }

  if(enemyHP <= 0) return nextScene();

  setTimeout(() => {
    const power = Math.floor(Math.random() * 3);
    if(power === 0) { playerHP -= 15; log.innerText = "Tanguy lance 'PROJET EN RETARD' (-15 PV) !"; }
    else if(power === 1) { playerHP -= 20; log.innerText = "Tanguy utilise 'SÉANCE CARDIO' (-20 PV) !"; }
    else { playerHP -= 10; log.innerText = "Tanguy critique ton style (-10 PV) !"; }
    
    document.getElementById("pHP").style.width = playerHP + "%";
    document.getElementById("eHP").style.width = (enemyHP/120*100) + "%";
    
    if(playerHP <= 0) { alert("Tyron a trop pleuré... il a perdu !"); location.reload(); }
  }, 600);
}

function dressGame() {
  const game = document.getElementById("game");
  game.innerHTML = `<div class="scene active beach-bg">
    <div class="dialogue">Le look ultime du boxeur philippin :</div>
    <button onclick="alert('Trop classique pour un BG comme Tyron')">Short de sport</button>
    <button onclick="alert('CHARISME EXPLOSIF !'); nextScene();">LA PERRUQUE ROSE</button>
  </div>`;
}

function attackDragon() {
  dragonHP--;
  document.getElementById("dHP").innerText = dragonHP;
  document.getElementById("dragon").style.transform = "scale(1.3) rotate(5deg)";
  setTimeout(() => { if(document.getElementById("dragon")) document.getElementById("dragon").style.transform = "scale(1)"; }, 100);
  if(dragonHP <= 0) nextScene();
}

renderScene();
</script>
</body>
</html>
