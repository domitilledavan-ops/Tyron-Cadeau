<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tyron : Le Chevalier au Cœur de Soie</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Press Start 2P', cursive;
      background: #050505; color: white; overflow: hidden;
    }

    #game { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }

    .scene { position: absolute; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; padding: 20px; z-index: 5; animation: fadeIn 0.8s; }
    .active { display: flex; }

    .dialogue { background: rgba(0,0,0,0.9); border: 4px solid #fff; padding: 15px; max-width: 85%; line-height: 1.6; font-size: 10px; margin-top: 15px; box-shadow: 0 0 20px rgba(255,255,255,0.2); position: relative; }
    
    .floating-text {
      position: absolute; color: #ff00ea; font-size: 12px; font-weight: bold;
      animation: floatUp 1.5s forwards; pointer-events: none; z-index: 10;
      text-shadow: 2px 2px #000;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-100px); }
    }

    button { margin: 5px; padding: 10px; font-family: inherit; background: #ffea00; border: 3px solid #000; cursor: pointer; font-size: 8px; transition: 0.2s; }
    button:hover { background: #ffae00; transform: translateY(-2px); }
    button:disabled { background: #555; cursor: not-allowed; }

    /* TYRON PIXEL ART - DESIGN AMÉLIORÉ */
    .tyron-pixel { position: relative; width: 110px; height: 160px; animation: idle 1.2s infinite alternate; }
    .t-cape { width: 80px; height: 100px; background: #c0392b; position: absolute; top: 55px; left: 15px; border: 3px solid #000; border-radius: 0 0 20px 20px; animation: capeMove 0.6s infinite alternate; z-index: -1; }
    .t-helmet { width: 54px; height: 50px; background: #bdc3c7; position: absolute; top: 5px; left: 28px; border: 4px solid #000; box-shadow: inset -5px -5px 0 #7f8c8d; }
    .t-plume { width: 10px; height: 25px; background: #f1c40f; position: absolute; top: -15px; left: 22px; border: 3px solid #000; }
    .t-visor { width: 44px; height: 8px; background: #34495e; position: absolute; top: 18px; left: 5px; overflow: hidden; }
    .t-visor::after { content: ''; position: absolute; width: 10px; height: 100%; background: rgba(255,255,255,0.4); animation: visorscan 2s infinite; }
    .t-body { width: 64px; height: 75px; background: #27ae60; position: absolute; top: 55px; left: 23px; border: 4px solid #000; box-shadow: inset 5px 5px 0 #2ecc71; }
    .t-shoulder { width: 30px; height: 30px; background: #95a5a6; position: absolute; top: 50px; border: 3px solid #000; z-index: 2; }
    .t-l { left: 5px; } .t-r { right: 5px; }
    .t-belt { width: 64px; height: 12px; background: #f39c12; position: absolute; top: 95px; left: 0; border-top: 3px solid #000; border-bottom: 3px solid #000; }

    /* ANIMATIONS TEXTE DÉFILANT */
    .flowers-bg { background: #601a35; position: relative; overflow: hidden; }
    .crawl-container {
      width: 80%; height: 60%;
      perspective: 400px;
      overflow: hidden;
      z-index: 5;
    }
    .crawl-content {
      position: relative;
      animation: crawl 25s linear forwards;
      color: #ffb6c1;
      line-height: 2.2;
      font-size: 11px;
      text-align: center;
    }

    @keyframes crawl {
      0% { top: 100%; transform: rotateX(20deg); }
      100% { top: -200%; transform: rotateX(20deg); }
    }
    
    @keyframes visorscan { 0% { left: -10px; } 100% { left: 50px; } }
    @keyframes capeMove { from { transform: skewX(-2deg); } to { transform: skewX(2deg); } }
    @keyframes idle { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* DÉCORS PLAGE */
    .beach-bg { background: linear-gradient(to bottom, #1e90ff, #87ceeb 50%, #f0e68c 50%, #edc9af); }
    .wave { position: absolute; width: 200%; height: 20px; background: rgba(255,255,255,0.3); top: 52%; animation: waveMove 4s infinite linear; }
    @keyframes waveMove { from { left: -100%; } to { left: 0; } }
  </style>
</head>
<body>
<div id="game"></div>

<script>
let currentScene = 0;
let enemyHP = 150;
let playerHP = 100;
let dragonHP = 15;
let isBusy = false;

const scenes = [
{
  bg: 'stars',
  content: `
    <div style="color:#00ffcc; text-shadow:2px 2px #000; line-height:1.6; font-size:11px;">
      Né en Allemagne et élevé à Brive, Tyron a tracé son propre chemin.<br><br>
      Fils d'un père dont il a hérité la précision chinoise, il a su s'affranchir du passé pour devenir l'homme qu'il est aujourd'hui : un colosse autonome et fier.<br><br>
      Un guerrier Nak Muay capable de briser des planches, mais dont le cœur bat plus fort que ses poings.
    </div>`
},
{
  content: `
    <div class="tyron-pixel">
      <div class="t-plume"></div><div class="t-cape"></div>
      <div class="t-helmet"><div class="t-visor"></div></div>
      <div class="t-shoulder t-l"></div><div class="t-shoulder t-r"></div>
      <div class="t-body"><div class="t-belt"></div></div>
    </div>
    <div class="dialogue">
      Avec sa guilde légendaire (Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste), Tyron est le pilier sur lequel tout le monde s'appuie.<br><br>
      Derrière ses muscles de boxeur et son armure d'ingénieur, il reste ce géant sensible, toujours prêt pour un éclat de rire ou une discussion profonde.
    </div>`
},
{
  content: `
    <div class="dialogue">
      Arrivé à l'ICAM, le danger surgit... <b>TANGUY LE SORCIER</b> bloque le passage.<br><br>
      "Tyron... je t'attendais. Tes épaules me barrent l'horizon, et mon cœur s'emballe... de haine ! Je vais te réduire en poussière pour que tu ne puisses plus m'ignorer !"
    </div>`
},
{
  id: "battle",
  content: `
    <div style="background:#222; border:4px solid white; padding:10px; width:90%; position:relative;">
      <div style="display:flex; justify-content:space-between; font-size:8px;">
        <div>TYRON: <span id="pHP">100</span>%</div>
        <div>TANGUY: <span id="eHP">100</span>%</div>
      </div>
      <div style="font-size:40px; margin:10px;">🧙‍♂️⚡</div>
      <p id="log" style="font-size:8px; color:yellow; height:30px;">Tanguy ajuste sa mèche en soupirant.</p>
      <div id="battle-btns">
        <button onclick="fight('kick')">KICK DE MUAY THAÏ</button>
        <button onclick="fight('look')">REGARD INTENSE</button>
        <button onclick="fight('whey')" style="background:#fff">BOIRE WHEY (+30HP)</button>
      </div>
    </div>`
},
{
  content: `
    <div class="dialogue">
      Tanguy, à bout de souffle : "Ta force... ton charisme... c'est trop pour moi Tyron. Je pars faire des pompes pour t'oublier !".<br><br>
      Tyron retrouve la team ICAM (Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan et Quentin).
    </div>`
},
{
  bg: 'flowers-bg',
  content: `
    <div class="crawl-container">
      <div class="crawl-content">
        🌸 LA RENCONTRE DU DESTIN 🌸<br><br>
        Devant le parvis de l'église,<br>le temps sembla se figer.<br><br>
        Tyron, le colosse de Brive,<br>sentit une aura inhabituelle.<br><br>
        Soudain, elle apparut.<br>Une Princesse Rousse aux yeux verts,<br>éclatante comme une aube corrézienne.<br><br>
        Leurs regards se croisèrent.<br><br>
        Lui, qui savait gérer le stress<br>d'un ring et la rigueur de l'ICAM,<br>se sentit soudain timide.<br><br>
        C'était une évidence.<br>Le guerrier venait de trouver sa muse.<br><br>
        🌺 🌸 🌺
      </div>
    </div>`
},
{
  bg: 'beach-bg',
  content: `
    <div class="wave"></div>
    <div id="dress-area" style="position:relative; width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="dialogue">Séparés par les mers ! Philippines vs Madrid.<br>Tyron doit choisir le look ultime.</div>
        <div id="dress-btns-container" style="margin-top:10px;">
            <button onclick="animateResponse(this, 'Trop simple !', false)">Maillot Classique</button>
            <button onclick="animateResponse(this, 'CHARISME MAX !', true)">PERRUQUE ROSE & GANTS</button>
            <button onclick="animateResponse(this, 'Tanguy valide !', false)">Torse nu huilé</button>
        </div>
    </div>`
},
{
  content: `
    <div class="dialogue">
      DRAME ! La Sorcière Violette a empoisonné la Princesse !<br><br>
      Elle ne se réveillera que si le Dragon de la Tristesse est terrassé !
    </div>`
},
{
  content: `
    <div id="dragon-box" style="font-size:70px; animation: bounce 0.5s infinite;">🐉</div>
    <div class="dialogue">Dernière épreuve !</div>
    <button id="atk-dragon">🥊 COMBO FINAL (<span id="dHP">15</span>)</button>`
},
{
  bg: 'stars',
  content: `
    <div style="color:#ffd700; text-shadow:2px 2px #f00;">
      👑 LÉGENDE ACCOMPLIE 👑<br><br>
      Tyron a triomphé !<br><br>
      De Brive aux Philippines, son nom résonne.<br><br>
      <b>CADEAU :</b> LA MONTRE DE SPORT LÉGENDAIRE.<br><br>
      JOYEUX ANNIVERSAIRE TYRON !
    </div>`
}
];

function renderScene() {
  const g = document.getElementById("game");
  let s = scenes[currentScene];
  g.className = s.bg || "";
  g.innerHTML = `<div class="scene active" id="scene-root">${s.content}${shouldShowBtn() ? '<button onclick="nextScene()">CONTINUER</button>' : ''}</div>`;
  if(currentScene === 8) document.getElementById('atk-dragon').onclick = attackDragon;
}

function shouldShowBtn() { return ![3, 6, 8, 9].includes(currentScene); }
function nextScene() { currentScene++; renderScene(); }

function animateResponse(btn, text, isCorrect) {
  const floating = document.createElement('div');
  floating.className = 'floating-text';
  floating.innerText = text;
  floating.style.left = btn.offsetLeft + "px";
  floating.style.top = btn.offsetTop + "px";
  document.getElementById('dress-area').appendChild(floating);
  if(isCorrect) setTimeout(nextScene, 2000);
}

function fight(type) {
  if(isBusy) return;
  isBusy = true;
  const log = document.getElementById("log");
  const btns = document.getElementById("battle-btns").querySelectorAll("button");
  btns.forEach(b => b.disabled = true);

  if(type === 'kick') { enemyHP -= 30; log.innerText = "Tyron frappe fort !"; }
  if(type === 'look') { enemyHP -= 50; log.innerText = "Tanguy rougit : 'Arrête ce regard !'"; }
  if(type === 'whey') { playerHP = Math.min(100, playerHP + 30); log.innerText = "Tyron boit sa Whey."; }
  
  updateBars();

  setTimeout(() => {
    if(enemyHP <= 0) {
      log.innerText = "Tanguy : 'Ta beauté me terrasse !'";
      setTimeout(nextScene, 2000);
    } else {
      const moves = [{txt: "Tanguy : 'Regarde mes pecs !'", dmg: 10}, {txt: "Tanguy : 'Pourquoi tu m'as ghosté?'", dmg: 20}];
      const m = moves[Math.floor(Math.random()*moves.length)];
      playerHP -= m.dmg;
      log.innerText = m.txt;
      updateBars();
      setTimeout(() => { isBusy = false; btns.forEach(b => b.disabled = false); }, 2000);
    }
  }, 2000);
}

function updateBars() {
  document.getElementById("pHP").innerText = playerHP;
  document.getElementById("eHP").innerText = Math.max(0, enemyHP);
}

function attackDragon() {
  dragonHP--;
  document.getElementById("dHP").innerText = dragonHP;
  if(dragonHP <= 0) nextScene();
}

renderScene();
</script>
</body>
</html>
