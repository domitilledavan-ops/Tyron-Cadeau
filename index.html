<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tyron Quest - Aventure Rétro</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Press Start 2P -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap">
  <style>
    body {
      margin:0;
      background: #2c3d4f;
      font-family: 'Press Start 2P', monospace;
      color: #fdfdff;
      overflow-x: hidden;
      min-height: 100vh;
    }
    #interface {
      max-width: 920px;
      margin: 32px auto 16px auto;
      background: linear-gradient(135deg,#2f5557,#4066d8 70%);
      border: 8px solid #fd38a0;
      border-radius: 16px;
      box-shadow: 0 0 22px #0e0c4c;
      padding: 24px;
      position: relative;
      outline: 6px solid #f8c400;
      outline-offset: -8px;
    }
    #title {
      text-align:center;
      font-size: 2em;
      color: #f8c400;
      letter-spacing:4px;
      text-shadow:2px 2px #fd38a0,0 4px #227b7b;
      margin-bottom:24px;
    }
    .dialogue-box {
      background: #f4f4f4;
      border: 4px solid #227b7b;
      border-radius: 8px;
      color: #27313b;
      padding: 20px;
      margin: 12px auto;
      font-size: 1em;
      line-height:1.6;
      box-shadow: 0 0 4px #f8c400;
      animation: retrofade 1s;
      font-family: 'Press Start 2P', monospace;
    }
    @keyframes retrofade {
      from {opacity:0;}
      to {opacity:1;}
    }
    .sprite-area {
      height:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:8px;
      margin-top:0;
    }
    .tyron-pixel {
      font-family: 'Press Start 2P', monospace;
      width:64px;
      height:100px;
      margin: 0 18px;
      position:relative;
      display:inline-block;
      animation:pulse 2s infinite;
      /* Pixelart works via box-shadow - see below */
    }
    /* CSS PIXEL ART de Tyron */
    .tyron-pixel::before {
      content:'';
      display:block;
      width:2px;
      height:2px;
      /* This is Tyron in pixel art ! Tunic+Hat+Face+Sword+Boots+Shields */
      box-shadow:
        /* Hat - Vert émeraude */
        14px 2px #22bf38,
        16px 2px #22bf38,
        18px 2px #1e9e2a,
        12px 4px #3cf244,
        14px 4px #22bf38,
        16px 4px #2dd955,
        18px 4px #2dd955,
        20px 4px #22bf38,
        22px 4px #227b7b,

        /* Hat point & bordures */
        18px 6px #3cf244,
        16px 6px #22bf38,
        20px 6px #1e9e2a,
        18px 8px #22bf38,
        20px 8px #3cf244,

        /* Face */
        16px 8px #ffffcc,
        18px 10px #ffe0b0,
        16px 10px #ffe0b0,
        14px 10px #ffe0b0,

        /* Eyes */
        16px 10px #563c2e,
        18px 12px #2f1e11,
        14px 12px #2f1e11,

        /* Body - tunique verte */
        16px 14px #22bf38,
        18px 14px #3cf244,
        14px 14px #1e9e2a,
        16px 16px #22bf38,
        18px 16px #22bf38,
        14px 16px #2dd955,
        20px 16px #22bf38,

        /* Belt/Sword */
        15px 16px #604020,
        19px 16px #f8c400,
        17px 16px #f8c400,
        17px 18px #f8c400,
        17px 20px #706e76,

        /* Arms */
        14px 18px #ffe0b0,
        20px 18px #ffe0b0,
        16px 18px #2dd955,
        18px 18px #22bf38,

        /* Legs */
        16px 22px #a37c33,
        18px 22px #503e24,
        14px 22px #503e24,
        20px 22px #967341,

        /* Boots */
        14px 24px #36323a,
        16px 24px #3f2423,
        18px 24px #362e28,
        20px 24px #3f2423,

        /* Shield (bleu pixel relief) */
        22px 16px #3299fe,
        22px 18px #56b9ff,
        23px 16px #183646,
        23px 18px #3299fe,

        /* Sword silver - main gauche */
        12px 16px #d5d5e0,
        12px 18px #c8e2ff,
        10px 16px #a9b2c3,

        /* Chapeau ombre - relief */
        14px 6px #0c811d,

        /* Chapeau rebord doré */
        20px 10px #f8c400,

        /* Tunique intérieur ombre relief */
        16px 18px #1e9e2a,
        18px 20px #227b7b

        ;
      position:absolute;
      top:0; left:0;
    }
    /* ANIMATION Tyron Pulse */
    @keyframes pulse {
      0% {transform:scale(1);}
      50% {transform:scale(1.05);}
      100% {transform:scale(1);}
    }
    /* Dialogue */
    .dialogue-speaker {
      color:#fd38a0;
      font-size:.9em;
      letter-spacing:2px;
      margin-bottom:8px;
      font-family: 'Press Start 2P', monospace;
    }
    /* Buttons */
    .pixel-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 1em;
      color: #27313b;
      background: linear-gradient(90deg, #f8c400, #fd38a0 60%);
      border: 4px solid #227b7b;
      border-radius: 6px;
      box-shadow: 3px 3px 0 #4384d9, 0 0 4px #fd38a0 inset;
      padding:12px 18px;
      margin:12px 8px;
      cursor:pointer;
      transition: transform .08s;
    }
    .pixel-btn:active {
      background: linear-gradient(90deg,#fd38a0,#f8c400 60%);
      transform:scale(0.98);
    }
    /* Sprite area ENEMI, EMOJIS */
    .emoji-friends {font-size:3em;}
    .emoji-boss {font-size:5em;}
    /* Décor CSS NES */
    .decor-icam {
      width:100%;
      height:100px;
      background: linear-gradient(135deg,#eaf8ff,#d2ceaf 85%);
      border-bottom: 4px solid #227b7b;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom: 10px;
    }
    .decor-plage {
      width:100%;
      height:100px;
      background: linear-gradient(90deg,#48e3ac 15%,#b6e0ff 45%,#fdea9c 70%,#ffecb3 100%);
      border-bottom: 4px solid #f8c400;
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      position:relative;
    }
    .palmtree {
      width:20px;height:70px;
      position:absolute;
      left:35px;bottom:10px;
      background:#644b13;
      border-radius:8px;
    }
    .palmtree::after {
      content:'';
      display:block;
      width: 46px;
      height: 16px;
      border-radius:22px 32px 0 0;
      background: linear-gradient(90deg,#34d172,#28a964 60%);
      position:absolute;top:0;left:-18px;
      transform:rotate(-14deg);
    }
    /* Rose Manga */
    .decor-manga {
      width:100%;
      height:120px;
      background:linear-gradient(90deg,#ffd6fa #fd38a0 80%);
      text-align:center;
      padding-top:20px;
      color:#fd38a0;
      font-size:2.2em;
      letter-spacing:4px;
    }
    /* Mariage */
    .decor-wedding {
      width:100%;
      height:120px;
      background:linear-gradient(90deg,#fffefa,#fd38a0 80%);
      text-align:center;
      padding-top:12px;
      color:#227b7b;
      font-size:2em;
    }
    /* Message Final */
    .sparkle {
      color:#f8c400;
      text-shadow:0 4px #fd38a0,0 8px #227b7b;
      letter-spacing:6px;
      font-size:1.8em;
      text-align:center;
      animation: sparkle 1.2s infinite;
      font-family: 'Press Start 2P', monospace;
      margin-top:22px;
    }
    @keyframes sparkle {
      0% {filter:brightness(1);}
      50% {filter:brightness(2);}
      100% {filter:brightness(1);}
    }
    /* Pokémon Combat */
    .combat-pokemon {
      background:#f2f2f2;
      border: 6px solid #227b7b;
      border-radius: 12px;
      box-shadow: 0 0 4px #fd38a0;
      padding:12px 8px;
      margin:24px auto;
      width:420px;
      font-family: 'Press Start 2P', monospace;
    }
    .combat-pokemon .tyron-combat {
      width:42px;display:inline-block;
      vertical-align:middle;
      margin-right:12px;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .combat-pokemon .tanguy-combat {
      font-size:3em;display:inline-block;
      margin-left:12px;
      vertical-align:middle;
      margin-top: 5px;
      margin-bottom: 5px;
      animation: flexjojo 1.4s infinite;
      transform: rotate(-12deg) scale(1.07);
    }
    @keyframes flexjojo{
      0%,100%{transform:rotate(-12deg) scale(1.07);}
      20%{transform:rotate(-18deg) scale(1.15);}
      60%{transform:rotate(2deg) scale(0.96);}
    }
    .combat-bars {
      font-size:.9em;
      margin-bottom:8px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .combat-bars span {
      background:#3299fe;
      padding:6px 14px;
      color:#fff;
      border-radius:3px;
      border: 2px solid #fff;
      box-shadow:2px 2px #fd38a0;
    }
    .combat-choices {
      display:flex;justify-content:space-between;gap:18px;
      margin-top:18px;
    }
    /* Boss Final DRAGON */
    .boss-area {
      display:flex;align-items:center;justify-content:center;
      margin:0 36px 18px 36px;
      position:relative;
      height:150px;
    }
    .boss-area .emoji-boss {
      animation:dragonfire 1.2s infinite;
    }
    @keyframes dragonfire{
      0% {filter:drop-shadow(0 0 0px #f8c400);}
      50% {filter:drop-shadow(0 0 16px #fd38a0);}
      100% {filter:drop-shadow(0 0 0px #f8c400);}
    }
    .boss-flame {
      width:32px;
      height:32px;
      background: radial-gradient(circle at 14px 20px,#fd38a0,#f8c400,#f47a48 60%);
      border-radius:100%;
      position:absolute;
      left:105px;
      top:38px;
      animation: flame 0.9s infinite;
      z-index:2;
    }
    @keyframes flame {
      0% {opacity:.5;}
      50% {opacity:1;}
      100% {opacity:.5;}
    }
    /* Mini jeu Embrasser princesse */
    .kiss-area {
      margin:18px 0;
      text-align:center;
      background:linear-gradient(90deg,#ffd6fa,#d2ceaf 90%);
      border:4px solid #fd38a0;
      border-radius:12px;
      padding:18px;
    }
    .kiss-btn {
      font-size:2em;
      margin:0 12px;
      padding:12px 18px;
      border:4px solid #f8c400;
      border-radius:8px;
      background:#fff;
      color:#fd38a0;
      box-shadow:2px 2px #227b7b;
      font-family: 'Press Start 2P', monospace;
      cursor:pointer;
      transition: background .12s;
    }
    .kiss-btn:active {
      background:#fd38a0;
      color:#fff;
    }
    .kiss-papa-watch {
      display:inline-block;
      animation: lookleft 1.4s infinite;
    }
    @keyframes lookleft{
      0%,100% {filter:grayscale(0);}
      60% {filter:grayscale(0.92);}
    }

    /* Responsive */
    @media (max-width:700px){
      #interface{max-width:98vw;padding:8px;}
      .combat-pokemon {width:96vw;}
      .boss-area{margin:0 2vw;}
    }
  </style>
</head>
<body>
  <div id="interface">
    <div id="title">TYRON QUEST - PIXEL RÉTRO ADVENTURE</div>
    <div id="game"></div>
  </div>
  <script>
    // --- STATE ---
    const state = {
      step: 0,     // étape du scénario
      pokemon: {tyronHP: 62, tanguyHP: 60}, // combat
      dress:{robe:false,perruque:false},    // dress-up
      kisses:0, papaWatch:false,            // mini-jeu
      dragonHP: 18, }
    // --- FRIENDS ---
    const amis1 = '👦 🧑 🎸 👨‍🎤 🦄 🐼 🧑‍🔬'; // Jérémy, Louis, Hugo, Gabin, Sacha, Léon, Auguste
    const amis2 = '👸 👨‍🏫 👨‍🎓 🕵️‍♂️ 🦄 👨‍⚕️ 🕺 👨‍🚀 👨‍🔧'; // Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan, Quentin
    // --- MOTIFS ---
    const princessEmoji = '👸'; // rousse yeux verts
    // --- GAME ---
    function show() {
      let html = '';
      // Sprite zone !
      let sprite = '<div class="sprite-area"><span class="tyron-pixel"></span></div>';

      switch(state.step){
        // --- 1. PROLOGUE ---
        case 0:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">📝 Narrateur</div>';
          html += '<b>Il y a très longtemps...</b><br>Dans une contrée fort pixelisée, la légende naissait sous la forme d\'un petit chevalier, aussi coloré que l\'inventeur du Rubik\'s cube. Son nom ? <b>Tyron</b>.<br><br>Le 6 mai 2003 (un mardi, donc déjà condamné à galérer la semaine) naissait ce héros mystérieux au chapeau vert.<br><br>La rumeur prétend qu\'à sa naissance, le médecin a crié "Il est trop pixel pour toi !".</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">Naissance épique !</button>';
          break;

        // --- 2. Guilde Nouvelle Famille ---
        case 1:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">📝 Narrateur</div>';
          html += '<b>Tyron</b> grandit en recrutant sa première guilde légendaire :<br>';
          html += amis1+'<br>Jérémy, Louis, Hugo, Gabin, Sacha, Léon et Auguste.<br><br>Sérieusement, qui a déjà vu autant d\'amis en tunique verte ?';
          html += '<br>Ils ne sont pas pixel art, mais qui a le temps pour ça ?</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">La team pixel !</button>';
          break;

        // --- 3. Découverte: ICAM ---
        case 2:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">📝 Narrateur</div>';
          html += 'Après avoir survécu à <i>l\'épreuve du réveil matin</i>, Tyron décide de découvrir le monde (ou du moins, la ville voisine qui a une boulangerie ouverte le dimanche).<br><br>Il rejoint la légendaire académie des ingénieurs : <b>ICAM</b>.<br><br>Oui, l\'école où le café est aussi fort que les sauteuses en TP.</div>';
          html += '<div class="decor-icam"><span style="font-size:2.4em;">🏫 🛠️ 💡</span> <span class="tyron-pixel"></span></div>';
          html += '<button class="pixel-btn" onclick="next()">Je veux du savoir !</button>';
          break;

        // --- 4. Sorcier Tanguy ---
        case 3:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">🧙‍♂️ Le Sorcier Tanguy</div>';
          html += 'Mais à peine arrivé... le sorcier <b>Tanguy</b> apparaît.<br>Il envoie un sort :<br><b>Brouillard mental !</b><br>';
          html += 'Soudain, Tyron oublie qu\'il n\'a jamais su résoudre un intégrale.<br>Ce sort rend la machine à café invisible.<br>Aïe. Il va falloir un combat épique (et complètement déjanté) pour s\'en sortir !</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">À l\'attaque du sorcier !</button>';
          break;

        // --- 5. Combat Pokemon vs Tanguy ---
        case 4:
          html += '<div class="combat-pokemon">';
          // Tanguy sprite: emoji culturiste pose JoJo
          html += '<div class="combat-bars">';
          html += `<span>Tyron HP: ${state.pokemon.tyronHP}/62</span><span>Tanguy HP: ${state.pokemon.tanguyHP}/60</span>`;
          html += '</div>';
          html += '<span class="tyron-combat">';
          html += '<span class="tyron-pixel"></span>';
          html += '</span>';
          html += '<span class="tanguy-combat">💪🧙‍♂️</span>';

          html += '<div style="margin-top:8px;font-size:.9em;">Tanguy pose façon <i>JoJo\'s Bizarre Adventure</i> et te lance un regard ambigu...<br><span style="color:#fd38a0;">(on soupçonne qu\'il t\'aime bien en secret)</span></div>';
          html += '<div class="combat-choices">';
          html += `<button class="pixel-btn" onclick="atkPokemon(1)">Attaque Épée</button>`;
          html += `<button class="pixel-btn" onclick="atkPokemon(2)">Sort sarcastique</button>`;
          html += `<button class="pixel-btn" onclick="atkPokemon(3)">Manger une barre choco</button>`;
          html += '</div>';
          html += '</div>';
          break;

        // --- 6. Libéré du sort ---
        case 5:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Tyron</div>';
          html += '<b>Victoire !</b> Après un combat intense, tu as brisé le sort.<br>L\'univers te remercie (même la cafetière).<br>Le sorcier Tanguy, lui, s\'est abonné à ton Instagram.<br><i>"C\'était pas si mal"</i>, avoue-t-il en froissant sa tunique.<br>Et tu es enfin prêt à rencontrer tes nouveaux amis !';
          html += '</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">À la découverte de la guilde ICAM !</button>';
          break;

        // --- 7. Rencontre nouveaux amis ---
        case 6:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>';
          html += 'À l\'ICAM, Tyron découvre une guilde plus grande que les stocks de caféine :<br>';
          html += '<div class="emoji-friends">' + amis2 + '</div>';
          html += '<b>Louise, Martin, PA, Mathias, Charly, Micah, Pilou, Titouan, Quentin !</b><br>';
          html += 'On dirait qu\'on a recruté un club d\'émoticônes. Chacun a une spécialité :<br>Danse, robotique, stylos perdus, soirées à thème...';
          html += '</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">Légende à la messe !</button>';
          break;

        // --- 8. Rencontre Religion, princesse ---
        case 7:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>';
          html += 'Reconforté par ses nouveaux amis, Tyron reconnecte avec sa foi.<br>';
          html += 'Il va à la messe un dimanche pixelisé.<br>Et là<br><b>BOUM</b>: Une rencontre divine (et rousse)<br>';
          html += 'Une <b>princesse rousse aux yeux verts</b> apparaît, auréolée d\'un halo émoticône magique.<br>';
          html += '<div style="text-align:center;font-size:2.8em;">'+princessEmoji+'</div>';
          html += '</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">Magie manga !</button>';
          break;

        // --- 9. Rencontre Manga ---
        case 8:
          html += '<div class="decor-manga">🌸 🌹 <b>Rencontre manga !</b> 🌸 🌹</div>';
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Tyron</div>';
          html += '<b>BIM💥</b> Tyron bouscule la princesse (par accident, ou manque de pixels?).<br>';
          html += 'Fond rose pastel, yeux écarquillés... Le crush est en train d\'importer des feelings.<br>';
          html += 'Mais, typique : la vie n\'est pas un jeu vidéo facile. Les quêtes personnelles les séparent pendant un an...';
          html += '</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">Séparation tragique !</button>';
          break;

        // --- 10. Séparation & Philippines ---
        case 9:
          html += '<div class="decor-plage"><div class="palmtree"></div> <span style="font-size:3em;margin-left:80px">🏖️ 🍹 🎉</span></div>';
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>';
          html += 'La princesse part à <b>Madrid</b> pour une quête mystérieuse.<br>Tyron, lui, s\'envole aux <b>Philippines</b> accompagné de PA, Quentin, Martin et Pilou.<br>';
          html += 'Pas de dragons, mais du soleil et... des amis fêtards qui veulent aller en boîte !<br><br><i>L\'alcool n\'est pas cher : le pixel s\'active.</i>';
          html += '</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">Dress To Impress !</button>';
          break;

        // --- 11. Mini-jeu Dress to Impress ---
        case 10:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>';
          html += '<b>Mini-jeu : Dress To Impress</b> <br>Tyron doit choisir sa tenue pour rentrer en boîte.<br><br>';
          html += 'Attention, la combinaison gagnante : <b>Robe Pailletée + Perruque Rose</b>.<br>';
          html += '<div style="margin:12px;"><button class="pixel-btn" onclick="dress(\'robe\')">'+(state.dress.robe?'✅':'')+'Robe Pailletée</button><button class="pixel-btn" onclick="dress(\'perruque\')">'+(state.dress.perruque?'✅':'')+'Perruque Rose</button></div>';
          if(state.dress.robe && state.dress.perruque){
            html += '<div style="color:#227b7b;font-size:1.3em;margin:8px;">Parfait ! Un look qui ferait peur à n\'importe quel videur.</div>';
            html += '<button class="pixel-btn" onclick="next()">Retrouvailles !</button>';
          }else{
            html += '<div style="font-size:.95em;color:#fd38a0;">Il te manque un élément...</div>';
          }
          html += sprite;
          break;
        
        // --- 12. Retrouvailles --- 
        case 11:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>';
          html += '<b>Après une année de pixels lointains...</b><br>Tyron retrouve enfin la princesse !<br>';
          html += 'L\'ambiance est digne d\'une pub pour les retrouvailles d\'animaux disparus.<br><br>';
          html += '<b>Mais attention, le drame du croissant approche...</b>';
          html += '</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">Le drame du croissant...</button>';
          break;

        // --- 13. Sorcière Croissant ---
        case 12:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">🧙‍♀️ Sorcière violette</div>';
          html += '<span style="color:#9933ff;font-size:1.6em;">🧙‍♀️</span> <br>La terrible sorcière violette empoisonne la princesse avec un <b>croissant aux amandes</b>.<br>';
          html += 'Cuisine maléfique, effet immédiat : la princesse tombe dans un profond sommeil.<br><br>Le médic a dit "c\'est le gluten, sûrement un sort".<br><b>Un dragon du sommeil veille sur elle !</b>';
          html += '</div>';
          html += sprite;
          html += '<button class="pixel-btn" onclick="next()">Dragon final !</button>';
          break;

        // --- 14. Dragon du sommeil --- 
        case 13:
          html += '<div class="dialogue-box"><div class="dialogue-speaker">Narrateur</div>';
