<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYRON SAGA : LA QUÊTE DU CHEVALIER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated;}
body{font-family:'Press Start 2P',cursive;background:#050510;color:#f0f0f0;overflow:hidden;width:100vw;height:100vh;}
#game{width:100vw;height:100vh;position:relative;display:flex;align-items:center;justify-content:center;transition:background 0.5s;}

/* ── BG THEMES ─────────────────────────── */
#game.bg-space    {background:radial-gradient(ellipse at 50% 110%,#0d1b4b,#050510);}
#game.bg-forest   {background:linear-gradient(180deg,#071a07 0%,#0e3014 60%,#163a1a 100%);}
#game.bg-beach    {background:linear-gradient(180deg,#1060c8 0%,#3390e8 40%,#70c8f0 65%,#e8c840 78%,#c8a028 100%);}
#game.bg-flowers  {background:radial-gradient(ellipse at 50% 60%,#3d0b3d 0%,#1a0520 100%);}
#game.bg-church   {background:linear-gradient(180deg,#08101e 0%,#101828 50%,#181e30 100%);}
#game.bg-dark     {background:#030308;}
#game.bg-battle   {background:linear-gradient(180deg,#7aa8d8 0%,#9abce8 55%,#5a8832 55%,#3a6020 100%);}
#game.bg-beach2   {background:linear-gradient(180deg,#0870c0 0%,#40a8e0 40%,#80d0f0 65%,#f0d040 80%,#d0a030 100%);}
#game.bg-wedding  {background:radial-gradient(ellipse at 50% -20%,#2a1248,#0a0614 70%);}

/* ── SCENE SCROLL ───────────────────────── */
.scene-inner{
  max-height:100vh;overflow-y:auto;width:100%;max-width:580px;
  padding:16px 12px 24px;display:flex;flex-direction:column;align-items:center;
  scrollbar-width:thin;scrollbar-color:#ffd700 #050510;
  animation:fadeIn .4s ease;
}
.scene-inner::-webkit-scrollbar{width:5px;}
.scene-inner::-webkit-scrollbar-thumb{background:#ffd700;}

/* ── DIALOGUE BOX ───────────────────────── */
.box{
  background:#06060f;border:4px solid #ffd700;
  padding:14px 18px;width:100%;font-size:8.5px;line-height:2;text-align:left;
  box-shadow:4px 4px 0 #000,0 0 20px rgba(255,215,0,.08);
  position:relative;
}
.box::after{content:'';position:absolute;inset:3px;border:1px solid rgba(255,215,0,.15);pointer-events:none;}
.box h2{color:#ffd700;font-size:10px;margin-bottom:12px;text-shadow:2px 2px 0 #000;}
.box h2.center{text-align:center;}
.box .note{color:#aaa;font-size:7px;font-style:italic;}
.hl  {color:#ffd700;}
.hlr {color:#e63946;}
.hlb {color:#4a9eff;}
.hlp {color:#ce93d8;}
.hlg {color:#7cd87c;}

/* ── BUTTONS ────────────────────────────── */
.btn{
  font-family:'Press Start 2P',cursive;font-size:8px;padding:10px 14px;margin:5px;
  background:#1a3ea0;color:#fff;border:none;cursor:pointer;text-transform:uppercase;
  box-shadow:0 4px 0 #000a3a,4px 4px 0 #000;
  transition:transform .08s,box-shadow .08s;
}
.btn:hover{background:#2a55c8;transform:translate(-1px,-1px);box-shadow:1px 5px 0 #000a3a,5px 5px 0 #000;}
.btn:active{transform:translate(3px,3px);box-shadow:0 1px 0 #000,1px 1px 0 #000;}
.btn-gold{background:#a07800;color:#ffe060;box-shadow:0 4px 0 #3a2800,4px 4px 0 #000;}
.btn-gold:hover{background:#c09000;}
.btn-red {background:#7a0e16;color:#fff;box-shadow:0 4px 0 #2a0007,4px 4px 0 #000;}
.btn-red:hover{background:#a01020;}
.btn-grn {background:#1a5a20;color:#7dff7d;box-shadow:0 4px 0 #072a0a,4px 4px 0 #000;}
.btn-grn:hover{background:#226630;}
.btn-pnk {background:#6a0840;color:#ffb3d9;box-shadow:0 4px 0 #280018,4px 4px 0 #000;}
.btn-pnk:hover{background:#8a1058;}
.btn-big{font-size:10px;padding:13px 22px;}
.btn-row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:8px;}

/* ── TITLE CARD ─────────────────────────── */
.tag{
  font-size:6px;color:#ffd700;padding:4px 10px;
  background:rgba(0,0,0,.6);border:2px solid #ffd700;
  margin-bottom:8px;letter-spacing:1px;text-align:center;
}
.nameplate{
  font-size:7px;text-align:center;padding:3px 8px;margin-top:3px;
  background:#000;border:2px solid #ffd700;color:#ffd700;
  text-shadow:1px 1px 0 #000;
}

/* ── BATTLE ─────────────────────────────── */
.battle-wrap{width:100%;max-width:540px;background:#06060f;border:4px solid #ffd700;box-shadow:4px 4px 0 #000;}
/* HP row at top (SF2 style) */
.sf-hprow{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:#0a0a20;border-bottom:4px solid #ffd700;padding:8px 10px;gap:8px;
}
.sf-hp-block{display:flex;flex-direction:column;}
.sf-hp-block.right{align-items:flex-end;}
.sf-name{font-size:6px;color:#ffd700;margin-bottom:3px;}
.sf-bar{width:100%;height:10px;background:#111;border:2px solid #555;position:relative;}
.sf-fill{height:100%;background:#4caf50;transition:width .3s;}
.sf-fill.med{background:#ff9800;}
.sf-fill.low{background:#e63946;}
.sf-hp-num{font-size:5px;color:#aaa;margin-top:2px;}
.sf-vs{font-size:10px;color:#ffd700;text-align:center;text-shadow:0 0 10px #ffd700;}

/* Stage */
.sf-stage{
  height:190px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#7aa8d8 0%,#9abce8 54%,#5a8832 54%,#3a6020 100%);
  border-bottom:4px solid #000;
}
.sf-stage-floor{position:absolute;bottom:0;left:0;right:0;height:46%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0,rgba(255,255,255,.04) 40px,transparent 40px,transparent 80px);}
.sf-p1{position:absolute;left:16px;bottom:0;}
.sf-p2{position:absolute;right:16px;bottom:0;}
.sf-clouds{position:absolute;top:8px;left:0;right:0;height:30px;
  background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 30'><ellipse cx='30' cy='20' rx='20' ry='10' fill='white' opacity='.4'/><ellipse cx='120' cy='22' rx='15' ry='8' fill='white' opacity='.3'/></svg>") repeat-x;
  background-size:200px 30px;}

.battle-log{
  font-size:8px;padding:10px 12px;min-height:58px;line-height:1.8;
  background:#04040e;border-bottom:4px solid #ffd700;
}
.battle-acts{
  display:grid;grid-template-columns:1fr 1fr;
  background:#08081a;
}
.battle-acts .btn{font-size:7px;padding:9px 6px;margin:0;border-radius:0;
  outline:1px solid rgba(255,215,0,.3);box-shadow:none;}
.battle-acts .btn:hover{transform:none;}

/* ── OUTFIT PICKER ──────────────────────── */
.outfit-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:8px 0;}
.outfit-opt{
  background:#0a0a24;border:3px solid #1a3ea0;padding:10px 8px;
  cursor:pointer;text-align:center;font-size:6.5px;width:110px;line-height:1.8;
  transition:border-color .15s;
}
.outfit-opt:hover{border-color:#ffd700;}
.outfit-opt.sel{border-color:#4caf50;background:#061a09;}
.outfit-opt .outfit-char{display:flex;justify-content:center;margin-bottom:6px;}

/* ── KISS GAME ──────────────────────────── */
.kiss-field{
  width:300px;height:180px;background:#10011a;
  border:4px solid #ff69b4;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:space-around;
  padding:10px;
}
.love-bar-outer{width:100%;height:10px;background:#1a001a;border:2px solid #ff69b4;}
.love-bar-fill{height:100%;background:linear-gradient(90deg,#ff69b4,#ff1493);transition:width .08s;}

/* ── STARS FINALE ───────────────────────── */
@keyframes star-fall{0%{transform:translateY(-30px) rotate(0deg) scale(1);opacity:1;}100%{transform:translateY(105vh) rotate(720deg) scale(.5);opacity:0;}}
.star-p{position:fixed;pointer-events:none;z-index:9999;animation:star-fall linear forwards;font-size:14px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes glow2{0%,100%{text-shadow:0 0 6px #ffd700,0 0 12px #ffd700;}50%{text-shadow:0 0 20px #ffd700,0 0 40px #ff9800,0 0 60px #ff4500;}}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-3px);}40%,80%{transform:translateX(3px);}}
@keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.glow{animation:glow2 2s infinite;}
.blink{animation:blink 1s infinite;}
.shake{animation:shake .3s;}
</style>
</head>

function px(rows,sc){
  if(!rows||!rows.length)return'';
  const h=rows.length,w=rows[0].length;

}

function renderBattle(type){
  const isT=(type==='tanguy');

  const eName=isT?'SORCIER TANGUY':'DRAGON TRISTESSE';

        <div class="sf-name">${eName}</div>

  const log=document.getElementById('bLog');
  let dmg=0,heal=0,msg='';
  if(move==='kick'){dmg=30+~~(Math.random()*20);msg=`Tyron balance un High-Kick ! ${dmg} dégâts !`;}
  else if(move==='charisme'){dmg=38+~~(Math.random()*25);msg=`Tyron contracte les pecs au maximum ! ${dmg} dégâts !`;}
  else if(move==='whey'){heal=30+~~(Math.random()*20);playerHP=Math.min(100,playerHP+heal);msg=`Tyron boit sa Whey protéinée ! +${heal} HP !`;}
  else{dmg=48+~~(Math.random()*28);msg=`COMBO LÉGENDAIRE DE CHEVALIER ! ${dmg} dégâts !`;}
  enemyHP=Math.max(0,enemyHP-dmg);
  updateBars(maxE); if(log)log.innerHTML=msg;
  setTimeout(()=>{
    if(enemyHP<=0){
      if(log)log.innerHTML=`<span style="color:#ffd700">★ VICTOIRE ! ${isT?"Tanguy s'effondre dans une dernière pose...":"Le Dragon rugit une ultime fois !"}</span>`;
      setTimeout(nextSc,1600);return;
    }
    let ed=10+~~(Math.random()*15); playerHP=Math.max(0,playerHP-ed);
    const eMsg=isT?TANGUY_TAUNTS[~~(Math.random()*TANGUY_TAUNTS.length)]+` (-${ed} HP)`:DRAGON_ATK[~~(Math.random()*DRAGON_ATK.length)]+` (-${ed} HP)`;
    if(log)log.innerHTML=eMsg; updateBars(maxE);
    if(playerHP<=0){
      if(log)log.innerHTML=`<span style="color:#e63946">K.O. ! Mais un chevalier se relève !</span>`;
      playerHP=50; setTimeout(()=>{updateBars(maxE);isBusy=false;},1200);return;
    }
    isBusy=false;
  },950);
}

function updateBars(maxE){
  const eB=document.getElementById('eHP'),pB=document.getElementById('pHP');
  const eN=document.getElementById('eHPn'),pN=document.getElementById('pHPn');
  if(eB){eB.style.width=(enemyHP/maxE*100)+'%';eB.className='sf-fill'+(enemyHP/maxE<.2?' low':enemyHP/maxE<.5?' med':'');}
  if(pB){pB.style.width=playerHP+'%';pB.className='sf-fill'+(playerHP<20?' low':playerHP<50?' med':'');}
  if(eN)eN.textContent=`${enemyHP}/${maxE}`;
  if(pN)pN.textContent=`${playerHP}/100`;
}

function initKiss(){
  if(papaIntervalId)clearInterval(papaIntervalId);
  papaIntervalId=setInterval(()=>{
    if(sc!==17){clearInterval(papaIntervalId);return;}
    papaLooking=Math.random()>.45;
    const st=document.getElementById('papaSt');
    if(st)st.innerHTML=papaLooking
      ?`<div style="color:#e63946;font-size:9px;text-align:center;">${px(SPR_PAPA,2)}<br>PAPA REGARDE !</div>`
      :`<div style="color:#4caf50;font-size:9px;text-align:center;">${px(SPR_PAPA,2)}<br>Zzz... dort</div>`;
  },1300);
}
function startKiss(){
  stopKiss();
  kissIntervalId=setInterval(()=>{
    if(sc!==17){stopKiss();return;}
    const lf=document.getElementById('lFill'),msg=document.getElementById('kMsg');
    if(papaLooking){
      kissProgress=Math.max(0,kissProgress-10);
      if(msg)msg.innerHTML='<span style="color:#e63946">Il vous voit ! Reculez !</span>';
    }else{
      kissProgress+=3.5;
      if(msg)msg.innerHTML='<span style="color:#ff69b4">... doux ...</span>';
      if(kissProgress>=100){
        kissProgress=0; kissCount++;
        const kc=document.getElementById('kCount'); if(kc)kc.textContent=kissCount;
        if(msg)msg.innerHTML=`<span style="color:#ffd700">Bisou ${kissCount}/4 !</span>`;
        if(kissCount>=4){clearInterval(kissIntervalId);clearInterval(papaIntervalId);
          if(msg)msg.innerHTML='<span style="color:#ffd700">✨ Le sort est brisé !!!</span>';
          setTimeout(nextSc,1500);return;}
      }
    }
    if(lf)lf.style.width=kissProgress+'%';
  },80);
}
function stopKiss(){if(kissIntervalId){clearInterval(kissIntervalId);kissIntervalId=null;}}

================================================================ */
function selDress(which,val){
  if(which==='top')dressTop=val; else dressBtm=val;
  document.querySelectorAll('.outfit-opt').forEach(el=>{
    if(el.dataset.which===which)el.classList.remove('sel');
  });
  const el=document.querySelector(`[data-which="${which}"][data-val="${val}"]`);
  if(el)el.classList.add('sel');
  checkDress();
}
function checkDress(){
  if(!dressTop||!dressBtm)return;
  const res=document.getElementById('dRes'),btn=document.getElementById('dBtn');
  const win=(dressTop==='robe'&&dressBtm==='perruque');
  const ok=(dressTop==='nu'&&dressBtm==='short')||(dressTop==='robe'&&dressBtm==='short');
  if(win){
    if(res)res.innerHTML='<span style="color:#4caf50">COMBO LÉGENDAIRE !<br>La sécurité t\'applaudit !<br>PA pleure de fierté !</span>';
    if(btn)btn.style.display='inline-block';
  }else if(ok){
    if(res)res.innerHTML='<span style="color:#ff9800">Combinaison... audacieuse.<br>Le videur laisse passer par curiosité.</span>';
    if(btn)btn.style.display='inline-block';
  }else{
    if(res)res.innerHTML='<span style="color:#e63946">REFUSÉ ! Trop banal.<br>Essaie encore !</span>';
    if(btn)btn.style.display='none';
  }
}

      <p>Tanguy envoie un bouquet depuis l'hôpital, accompagné d'un mot : <em style="color:#aaa;">"Pourquoi pas moi ? Mon GymBro — T."</em></p><br>
      <hr style="border-color:#ffd700;margin:12px 0;">
      <p style="text-align:center;font-size:10px;" class="glow">RÉCOMPENSE LÉGENDAIRE</p><br>
      <p style="text-align:center;font-size:10px;color:#ffd700;line-height:1.8;">LA MONTRE DE SPORT<br>CONNECTÉE</p><br>
      <hr style="border-color:#ffd700;margin:12px 0;">
      <p style="text-align:center;font-size:12px;line-height:2;" class="glow">JOYEUX ANNIVERSAIRE<br>TYRON !<br>23 ANS !</p>
    </div>`;
}

function spawnStar(){
  const shapes=['★','✦','◆','▲','●','✶','♦'];
  const colors=['#ffd700','#ff69b4','#4a9eff','#7dff7d','#ff8040','#e040fb'];
  const el=document.createElement('div');
  el.className='star-p';
  el.textContent=shapes[~~(Math.random()*shapes.length)];
  el.style.color=colors[~~(Math.random()*colors.length)];
  el.style.left=Math.random()*100+'vw';
  el.style.animationDuration=(2+Math.random()*2.5)+'s';
  el.style.animationDelay=Math.random()*0.5+'s';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),5000);
}

/* ================================================================
   GAME ENGINE
================================================================ */
function render(){
  const scene=SCENES[sc]; if(!scene)return;
  const game=document.getElementById('game');
  game.className=scene.bg||'bg-space';
  const wrap=document.createElement('div');
  wrap.className='scene-inner';
  wrap.innerHTML=scene.render();
  game.innerHTML=''; game.appendChild(wrap);
  wrap.scrollTop=0;
  if(scene.isKiss)initKiss();
}

function nextSc(){
  stopKiss();
  if(papaIntervalId){clearInterval(papaIntervalId);papaIntervalId=null;}
  sc++;
  if(sc<SCENES.length){
    const s=SCENES[sc]; if(s.onEnter)s.onEnter(); render();
  }
}

window.onload=render;
</script>
